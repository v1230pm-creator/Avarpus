# /etc/nginx/sites-available/api.avarpus.com
# Reverse proxy for the Avarpus API (systemd unit listens on 127.0.0.1:8080).
# Run `sudo certbot --nginx -d api.avarpus.com` AFTER the DNS record points
# here; certbot rewrites this file to add the TLS server block.

server {
    listen 80;
    listen [::]:80;
    server_name api.avarpus.com;

    # Uploads go straight to Google Cloud Storage via signed URLs, so the API
    # itself only sees JSON bodies (1 MB limit in Express). Keep a small
    # margin for the Matrix appservice callbacks.
    client_max_body_size 8m;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout  120s;
        proxy_send_timeout  120s;
        proxy_buffering     off;
    }
}
