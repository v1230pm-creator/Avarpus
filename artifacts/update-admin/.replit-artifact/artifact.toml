kind = "web"
previewPath = "/update-admin/"
title = "Avarpus Update Admin"
description = "A web-based admin panel for managing Avarpus Android app updates. Super admins upload releases, write notes and screenshots, publish or roll back versions, and review download and update-check statistics."
version = "1.0.0"
id = "artifacts/update-admin"
router = "path"

[[services]]
name = "web"
paths = [ "/update-admin/" ]
localPort = 22783

[services.development]
run = "pnpm --filter @workspace/update-admin run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/update-admin", "run", "build" ]
serve = "static"
publicDir = "artifacts/update-admin/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "22783"
BASE_PATH = "/update-admin/"
