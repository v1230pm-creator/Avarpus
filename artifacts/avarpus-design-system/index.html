  showcases the tokens (tokens.json) and the current component library.

-->

  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />

    <meta name="description" content="Avarpus Design System — design system preview built on Replit." />
    <link rel="icon" type="image/png" href="./avarpus-logo.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" media="print" onload="this.media='all'"

  </head>
  <body style="height: 100%; margin: 0">
    <div id="root" style="height: 100%"></div>
