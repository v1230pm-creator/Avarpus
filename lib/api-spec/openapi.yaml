openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Authentication operations
  - name: business
    description: Shop-scoped business data (repairs, customers, inventory, purchases, finance)
  - name: Storage
    description: Object storage upload and serving endpoints.
  - name: dashboard
    description: Read-only dashboard stats and activity feed.
  - name: chat
    description: Real-time chat rooms, messages, read receipts and call tokens.
paths:
  /auth/otp/request:
    post:
      operationId: authOtpRequest
      tags: [auth]
      summary: Request a login OTP for a mobile number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OtpRequestInput"
      responses:
        "200":
          description: OTP request accepted
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                required: [message]
  /auth/otp/resend:
    post:
      operationId: authOtpResend
      tags: [auth]
      summary: Resend a login OTP for a mobile number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OtpRequestInput"
      responses:
        "200":
          description: OTP resend request accepted
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                required: [message]
  /auth/otp/verify:
    post:
      operationId: authOtpVerify
      tags: [auth]
      summary: Verify a login OTP and sign in
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OtpVerifyInput"
      responses:
        "200":
          description: Signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSession"
  /auth/trusted-device/recover:
    post:
      operationId: authTrustedDeviceRecover
      tags: [auth]
      summary: Recover an Android trusted-device session without extending trust
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TrustedDeviceRecoveryInput"
      responses:
        "200":
          description: Recovered session, bounded by the original recovery deadline
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSession"
  /auth/otp/provider-status:
    get:
      operationId: authOtpProviderStatus
      tags: [auth]
      summary: Get the configured OTP provider status (super_admin only)
      responses:
        "200":
          description: Hanu OTP provider status without credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OtpProviderStatus"
  /auth/register/start:
    post:
      operationId: authRegisterStart
      tags: [auth]
      summary: Start registration and send email OTP
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterStartInput"
      responses:
        "200":
          description: OTP sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
  /auth/register/verify:
    post:
      operationId: authRegisterVerify
      tags: [auth]
      summary: Verify email OTP and create the account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterVerifyInput"
      responses:
        "200":
          description: >
            Dealer account created after email verification. Sign in is always
            completed separately with the registered mobile OTP.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegisterVerifyResult"
  /auth/me:
    get:
      operationId: authMe
      tags: [auth]
      summary: Get the current authenticated user
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    $ref: "#/components/schemas/AuthUser"
                required: [user]
    patch:
      operationId: authMeUpdate
      tags: [auth]
      summary: Update own profile (name, mobile)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProfileUpdateInput"
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    $ref: "#/components/schemas/AuthUser"
                required: [user]
  /notifications:
    get:
      operationId: notificationsList
      tags: [business]
      summary: Latest in-app notifications for the current user
      responses:
        "200":
          description: Notifications
          content:
            application/json:
              schema:
                type: object
                properties:
                  unreadCount: { type: number }
                  notifications:
                    type: array
                    items:
                      $ref: "#/components/schemas/AppNotification"
                required: [unreadCount, notifications]
  /notifications/read:
    post:
      operationId: notificationsMarkRead
      tags: [business]
      summary: Mark notifications read (all when ids omitted)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NotificationsReadInput"
      responses:
        "200":
          description: Marked read
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                required: [message]
  /staff:
    get:
      operationId: staffList
      tags: [auth]
      summary: List staff of the current dealer's shop (dealer/super_admin only)
      responses:
        "200":
          description: Staff members
          content:
            application/json:
              schema:
                type: object
                properties:
                  staff:
                    type: array
                    items:
                      $ref: "#/components/schemas/AuthUser"
                required: [staff]
    post:
      operationId: staffCreate
      tags: [auth]
      summary: Create a staff account in the current dealer's shop (dealer/super_admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StaffCreateInput"
      responses:
        "200":
          description: Staff account created
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    $ref: "#/components/schemas/AuthUser"
                required: [user]
  /staff/{id}/activate:
    patch:
      operationId: staffActivate
      tags: [auth]
      summary: Approve a pending staff account (dealer/super_admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Activated account
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    $ref: "#/components/schemas/AuthUser"
                required: [user]
  /staff/{id}/permissions:
    get:
      operationId: staffPermissionsGet
      tags: [auth]
      summary: Get role defaults, individual overrides, and effective permissions for one managed account
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Individual permission settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IndividualPermissions"
    put:
      operationId: staffPermissionsUpdate
      tags: [auth]
      summary: Set or clear individual permission overrides for one managed account
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IndividualFeaturesInput"
      responses:
        "200":
          description: Updated individual permission settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IndividualPermissions"
  /staff/{id}:
    patch:
      operationId: staffUpdate
      tags: [auth]
      summary: Update a staff member's profile (dealer/super_admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StaffUpdateInput"
      responses:
        "200":
          description: Updated account
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    $ref: "#/components/schemas/AuthUser"
                required: [user]
    delete:
      operationId: staffReject
      tags: [auth]
      summary: Reject and remove a pending staff account (dealer/super_admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Account removed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
  /auth/login-history:
    get:
      operationId: authLoginHistory
      tags: [auth]
      summary: List recent successful logins for the current user
      responses:
        "200":
          description: Login history
          content:
            application/json:
              schema:
                type: object
                properties:
                  events:
                    type: array
                    items:
                      $ref: "#/components/schemas/LoginEvent"
                required: [events]
  /auth/sessions:
    get:
      operationId: authSessions
      tags: [auth]
      summary: List active sessions for the current user
      responses:
        "200":
          description: Active sessions
          content:
            application/json:
              schema:
                type: object
                properties:
                  sessions:
                    type: array
                    items:
                      $ref: "#/components/schemas/SessionInfo"
                required: [sessions]
  /auth/sessions/{id}:
    delete:
      operationId: authRevokeSession
      tags: [auth]
      summary: Sign out a specific session by id
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Session revoked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
  /auth/sessions/revoke-others:
    post:
      operationId: authRevokeOtherSessions
      tags: [auth]
      summary: Sign out all sessions except the current one
      responses:
        "200":
          description: Other sessions revoked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
  /auth/logout:
    post:
      operationId: authLogout
      tags: [auth]
      summary: Sign out, invalidate the session, and revoke its trusted-device recovery when present
      responses:
        "200":
          description: Signed out
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
  /dealers:
    get:
      operationId: dealersList
      tags: [business]
      summary: List B2B dealers of the caller's shop with live repair counts
      parameters:
        - { name: q, in: query, required: false, schema: { type: string } }
      responses:
        "200":
          description: Dealers
          content:
            application/json:
              schema:
                type: object
                properties:
                  dealers:
                    type: array
                    items:
                      $ref: "#/components/schemas/DealerWithCounts"
                required: [dealers]
    post:
      operationId: dealersCreate
      tags: [business]
      summary: Create a B2B dealer in the caller's shop
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DealerInput"
      responses:
        "200":
          description: Created dealer
          content:
            application/json:
              schema:
                type: object
                properties:
                  dealer:
                    $ref: "#/components/schemas/Dealer"
                required: [dealer]
  /dealers/detect:
    get:
      operationId: dealersDetect
      tags: [business]
      summary: Detect active dealers whose registered mobile exactly matches
      parameters:
        - { name: mobile, in: query, required: true, schema: { type: string } }
      responses:
        "200":
          description: Matching active dealers (empty when none)
          content:
            application/json:
              schema:
                type: object
                properties:
                  dealers:
                    type: array
                    items:
                      $ref: "#/components/schemas/Dealer"
                required: [dealers]
  /dealers/me:
    get:
      operationId: dealersMe
      tags: [business]
      summary: Dealer-portal account's own dealer profile + stats
      responses:
        "200":
          description: Own dealer profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DealerProfile"
  /dealers/overview:
    get:
      operationId: dealersOverview
      tags: [business]
      summary: Overall dealer-repair statistics (dealer/owner only)
      responses:
        "200":
          description: Overview stats
          content:
            application/json:
              schema:
                type: object
                properties:
                  stats:
                    $ref: "#/components/schemas/DealerOverviewStats"
                required: [stats]
  /dealers/{id}:
    get:
      operationId: dealersGet
      tags: [business]
      summary: Dealer profile + full stats
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Dealer profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DealerProfile"
    patch:
      operationId: dealersUpdate
      tags: [business]
      summary: Update a dealer (dealer/owner only)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DealerInput"
      responses:
        "200":
          description: Updated dealer
          content:
            application/json:
              schema:
                type: object
                properties:
                  dealer:
                    $ref: "#/components/schemas/Dealer"
                required: [dealer]
  /customers:
    get:
      operationId: customersList
      tags: [business]
      summary: List customers of the caller's shop
      responses:
        "200":
          description: Customers
          content:
            application/json:
              schema:
                type: object
                properties:
                  customers:
                    type: array
                    items:
                      $ref: "#/components/schemas/Customer"
                required: [customers]
    post:
      operationId: customersCreate
      tags: [business]
      summary: Create a customer in the caller's shop
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CustomerInput"
      responses:
        "200":
          description: Created customer
          content:
            application/json:
              schema:
                type: object
                properties:
                  customer:
                    $ref: "#/components/schemas/Customer"
                required: [customer]
  /customers/{id}:
    patch:
      operationId: customersUpdate
      tags: [business]
      summary: Update a customer in the caller's shop
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CustomerInput"
      responses:
        "200":
          description: Updated customer
          content:
            application/json:
              schema:
                type: object
                properties:
                  customer:
                    $ref: "#/components/schemas/Customer"
                required: [customer]
  /repairs:
    get:
      operationId: repairsList
      tags: [business]
      summary: List repairs of the caller's shop (search + pagination)
      parameters:
        - { name: q, in: query, required: false, schema: { type: string } }
        - { name: status, in: query, required: false, schema: { type: string } }
        - { name: paymentStatus, in: query, required: false, schema: { type: string, enum: [paid, partial, pending] } }
        - { name: technicianId, in: query, required: false, schema: { type: string } }
        - { name: receivedById, in: query, required: false, schema: { type: string } }
        - { name: priority, in: query, required: false, schema: { type: string } }
        - { name: dateFrom, in: query, required: false, schema: { type: string } }
        - { name: dateTo, in: query, required: false, schema: { type: string } }
        - { name: warranty, in: query, required: false, schema: { type: string, enum: [active, expired, none] } }
        - { name: dealerId, in: query, required: false, schema: { type: string } }
        - { name: page, in: query, required: false, schema: { type: number } }
        - { name: limit, in: query, required: false, schema: { type: number } }
      responses:
        "200":
          description: Repairs
          content:
            application/json:
              schema:
                type: object
                properties:
                  repairs:
                    type: array
                    items:
                      $ref: "#/components/schemas/Repair"
                  total: { type: number }
                  page: { type: number }
                  limit: { type: number }
                required: [repairs]
    post:
      operationId: repairsCreate
      tags: [business]
      summary: Create a repair ticket in the caller's shop
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RepairInput"
      responses:
        "200":
          description: Created repair
          content:
            application/json:
              schema:
                type: object
                properties:
                  repair:
                    $ref: "#/components/schemas/Repair"
                required: [repair]
  /repairs/{id}:
    patch:
      operationId: repairsUpdate
      tags: [business]
      summary: Update a repair in the caller's shop
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RepairInput"
      responses:
        "200":
          description: Updated repair
          content:
            application/json:
              schema:
                type: object
                properties:
                  repair:
                    $ref: "#/components/schemas/Repair"
                required: [repair]
    delete:
      operationId: repairsDelete
      tags: [business]
      summary: Permanently delete a repair (dealer/owner only)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Repair deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                required: [message]
  /repairs/{id}/photos:
    get:
      operationId: repairPhotosList
      tags: [business]
      summary: List photos/documents attached to a repair
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Photos
          content:
            application/json:
              schema:
                type: object
                properties:
                  photos:
                    type: array
                    items:
                      $ref: "#/components/schemas/RepairPhoto"
                required: [photos]
    post:
      operationId: repairPhotosAdd
      tags: [business]
      summary: Attach an uploaded photo/document to a repair
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RepairPhotoInput"
      responses:
        "200":
          description: Created photo record
          content:
            application/json:
              schema:
                type: object
                properties:
                  photo:
                    $ref: "#/components/schemas/RepairPhoto"
                required: [photo]
  /repairs/{id}/parts:
    get:
      operationId: repairPartsList
      tags: [business]
      summary: List parts consumed on a repair
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Parts
          content:
            application/json:
              schema:
                type: object
                properties:
                  parts:
                    type: array
                    items:
                      $ref: "#/components/schemas/RepairPart"
                  canSeeCosts: { type: boolean }
                required: [parts]
    post:
      operationId: repairPartsAdd
      tags: [business]
      summary: Record a part used on a repair (deducts inventory)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RepairPartInput"
      responses:
        "200":
          description: Created part row
          content:
            application/json:
              schema:
                type: object
                properties:
                  part:
                    $ref: "#/components/schemas/RepairPart"
                required: [part]
  /repairs/{id}/events:
    get:
      operationId: repairEventsList
      tags: [business]
      summary: List the immutable activity timeline of a repair
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Events (newest first)
          content:
            application/json:
              schema:
                type: object
                properties:
                  events:
                    type: array
                    items:
                      $ref: "#/components/schemas/RepairEvent"
                required: [events]
  /repairs/{id}/payments:
    get:
      operationId: repairPaymentsList
      tags: [business]
      summary: List the payment ledger of a repair
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Payments (newest first)
          content:
            application/json:
              schema:
                type: object
                properties:
                  payments:
                    type: array
                    items: { $ref: "#/components/schemas/RepairPayment" }
                  refunds:
                    type: array
                    items: { $ref: "#/components/schemas/Refund" }
                required: [payments]
    post:
      operationId: repairPaymentsCreate
      tags: [business]
      summary: Record a payment against a repair (append-only ledger)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RepairPaymentInput" }
      responses:
        "200":
          description: Recorded payment
          content:
            application/json:
              schema:
                type: object
                properties:
                  payment: { $ref: "#/components/schemas/RepairPayment" }
                required: [payment]
  /repairs/{id}/payments/{paymentId}/void:
    post:
      operationId: repairPaymentVoid
      tags: [business]
      summary: Void/reverse a payment (dealer/owner only, audit-preserving)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: paymentId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RepairPaymentVoidInput" }
      responses:
        "200":
          description: The voided payment row
          content:
            application/json:
              schema:
                type: object
                properties:
                  payment: { $ref: "#/components/schemas/RepairPayment" }
                required: [payment]
  /payments:
    get:
      operationId: paymentsList
      tags: [business]
      summary: Shop-wide payment ledger with method totals (finance roles only)
      parameters:
        - { name: from, in: query, required: false, schema: { type: string } }
        - { name: to, in: query, required: false, schema: { type: string } }
      responses:
        "200":
          description: Payments (newest first) plus non-voided totals by method
          content:
            application/json:
              schema:
                type: object
                properties:
                  payments:
                    type: array
                    items:
                      allOf:
                        - { $ref: "#/components/schemas/RepairPayment" }
                        - type: object
                          properties:
                            repairTicket: { type: string }
                            customerName: { type: string }
                            dealerId: { type: string }
                            dealerName: { type: string }
                  totals:
                    type: object
                    properties:
                      total: { type: number }
                      byMethod:
                        type: object
                        additionalProperties: { type: number }
                    required: [total, byMethod]
                required: [payments, totals]
  /repairs/{id}/assign:
    post:
      operationId: repairAssignTechnician
      tags: [business]
      summary: Assign a technician to a repair (dealer/owner only)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RepairAssignInput" }
      responses:
        "200":
          description: Updated repair
          content:
            application/json:
              schema:
                type: object
                properties:
                  repair: { $ref: "#/components/schemas/Repair" }
                required: [repair]
  /repairs/{id}/testing:
    post:
      operationId: repairTesting
      tags: [business]
