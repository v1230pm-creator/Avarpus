openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Authentication operations
  - name: business
    description: Shop-scoped business data (repairs, customers, inventory, purchases, finance)
  - name: Storage
    description: Object storage upload and serving endpoints.
paths:
  /auth/login:
    post:
      operationId: authLogin
      tags: [auth]
      summary: Sign in with email/mobile and password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSession"
  /auth/otp/request:
    post:
      operationId: authOtpRequest
      tags: [auth]
      summary: Request a login OTP for a mobile number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OtpRequestInput"
      responses:
        "200":
          description: OTP request accepted
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                required: [message]
  /auth/otp/verify:
    post:
      operationId: authOtpVerify
      tags: [auth]
      summary: Verify a login OTP and sign in
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OtpVerifyInput"
      responses:
        "200":
          description: Signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSession"
  /auth/register/start:
    post:
      operationId: authRegisterStart
      tags: [auth]
      summary: Start registration and send email OTP
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterStartInput"
      responses:
        "200":
          description: OTP sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
  /auth/register/verify:
    post:
      operationId: authRegisterVerify
      tags: [auth]
      summary: Verify email OTP and create the account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterVerifyInput"
      responses:
        "200":
          description: >
            Dealer accounts are created and signed in (token + user).
            Staff accounts are created pending approval (pending + message, no token).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegisterVerifyResult"
  /auth/forgot/request:
    post:
      operationId: authForgotRequest
      tags: [auth]
      summary: Request a password reset OTP
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ForgotRequestInput"
      responses:
        "200":
          description: Request accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
  /auth/forgot/verify:
    post:
      operationId: authForgotVerify
      tags: [auth]
      summary: Verify a password reset OTP
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterVerifyInput"
      responses:
        "200":
          description: Verified
          content:
            application/json:
              schema:
                type: object
                properties:
                  resetToken: { type: string }
                required: [resetToken]
  /auth/forgot/reset:
    post:
      operationId: authForgotReset
      tags: [auth]
      summary: Reset password with a reset token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ForgotResetInput"
      responses:
        "200":
          description: Password updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
  /auth/me:
    get:
      operationId: authMe
      tags: [auth]
      summary: Get the current authenticated user
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    $ref: "#/components/schemas/AuthUser"
                required: [user]
  /staff:
    get:
      operationId: staffList
      tags: [auth]
      summary: List staff of the current dealer's shop (dealer/super_admin only)
      responses:
        "200":
          description: Staff members
          content:
            application/json:
              schema:
                type: object
                properties:
                  staff:
                    type: array
                    items:
                      $ref: "#/components/schemas/AuthUser"
                required: [staff]
    post:
      operationId: staffCreate
      tags: [auth]
      summary: Create a staff account in the current dealer's shop (dealer/super_admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StaffCreateInput"
      responses:
        "200":
          description: Staff account created
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    $ref: "#/components/schemas/AuthUser"
                required: [user]
  /staff/{id}/activate:
    patch:
      operationId: staffActivate
      tags: [auth]
      summary: Approve a pending staff account (dealer/super_admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Activated account
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    $ref: "#/components/schemas/AuthUser"
                required: [user]
  /staff/{id}:
    delete:
      operationId: staffReject
      tags: [auth]
      summary: Reject and remove a pending staff account (dealer/super_admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Account removed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
  /auth/login-history:
    get:
      operationId: authLoginHistory
      tags: [auth]
      summary: List recent successful logins for the current user
      responses:
        "200":
          description: Login history
          content:
            application/json:
              schema:
                type: object
                properties:
                  events:
                    type: array
                    items:
                      $ref: "#/components/schemas/LoginEvent"
                required: [events]
  /auth/sessions:
    get:
      operationId: authSessions
      tags: [auth]
      summary: List active sessions for the current user
      responses:
        "200":
          description: Active sessions
          content:
            application/json:
              schema:
                type: object
                properties:
                  sessions:
                    type: array
                    items:
                      $ref: "#/components/schemas/SessionInfo"
                required: [sessions]
  /auth/sessions/{id}:
    delete:
      operationId: authRevokeSession
      tags: [auth]
      summary: Sign out a specific session by id
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Session revoked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
  /auth/sessions/revoke-others:
    post:
      operationId: authRevokeOtherSessions
      tags: [auth]
      summary: Sign out all sessions except the current one
      responses:
        "200":
          description: Other sessions revoked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
  /auth/logout:
    post:
      operationId: authLogout
      tags: [auth]
      summary: Sign out and invalidate the session
      responses:
        "200":
          description: Signed out
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
  /customers:
    get:
      operationId: customersList
      tags: [business]
      summary: List customers of the caller's shop
      responses:
        "200":
          description: Customers
          content:
            application/json:
              schema:
                type: object
                properties:
                  customers:
                    type: array
                    items:
                      $ref: "#/components/schemas/Customer"
                required: [customers]
    post:
      operationId: customersCreate
      tags: [business]
      summary: Create a customer in the caller's shop
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CustomerInput"
      responses:
        "200":
          description: Created customer
          content:
            application/json:
              schema:
                type: object
                properties:
                  customer:
                    $ref: "#/components/schemas/Customer"
                required: [customer]
  /customers/{id}:
    patch:
      operationId: customersUpdate
      tags: [business]
      summary: Update a customer in the caller's shop
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CustomerInput"
      responses:
        "200":
          description: Updated customer
          content:
            application/json:
              schema:
                type: object
                properties:
                  customer:
                    $ref: "#/components/schemas/Customer"
                required: [customer]
  /repairs:
    get:
      operationId: repairsList
      tags: [business]
      summary: List repairs of the caller's shop
      responses:
        "200":
          description: Repairs
          content:
            application/json:
              schema:
                type: object
                properties:
                  repairs:
                    type: array
                    items:
                      $ref: "#/components/schemas/Repair"
                required: [repairs]
    post:
      operationId: repairsCreate
      tags: [business]
      summary: Create a repair ticket in the caller's shop
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RepairInput"
      responses:
        "200":
          description: Created repair
          content:
            application/json:
              schema:
                type: object
                properties:
                  repair:
                    $ref: "#/components/schemas/Repair"
                required: [repair]
  /repairs/{id}:
    patch:
      operationId: repairsUpdate
      tags: [business]
      summary: Update a repair in the caller's shop
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RepairInput"
      responses:
        "200":
          description: Updated repair
          content:
            application/json:
              schema:
                type: object
                properties:
                  repair:
                    $ref: "#/components/schemas/Repair"
                required: [repair]
  /repairs/{id}/photos:
    get:
      operationId: repairPhotosList
      tags: [business]
      summary: List photos/documents attached to a repair
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Photos
          content:
            application/json:
              schema:
                type: object
                properties:
                  photos:
                    type: array
                    items:
                      $ref: "#/components/schemas/RepairPhoto"
                required: [photos]
    post:
      operationId: repairPhotosAdd
      tags: [business]
      summary: Attach an uploaded photo/document to a repair
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RepairPhotoInput"
      responses:
        "200":
          description: Created photo record
          content:
            application/json:
              schema:
                type: object
                properties:
                  photo:
                    $ref: "#/components/schemas/RepairPhoto"
                required: [photo]
  /repairs/{id}/events:
    get:
      operationId: repairEventsList
      tags: [business]
      summary: List the immutable activity timeline of a repair
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Events (newest first)
          content:
            application/json:
              schema:
                type: object
                properties:
                  events:
                    type: array
                    items:
                      $ref: "#/components/schemas/RepairEvent"
                required: [events]
  /repairs/{id}/returns:
    post:
      operationId: returnsCreate
      tags: [business]
      summary: Open a return/rework case for a delivered repair
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReturnCreateInput"
      responses:
        "200":
          description: Created return case
          content:
            application/json:
              schema:
                type: object
                properties:
                  return: { $ref: "#/components/schemas/RepairReturn" }
                required: [return]
  /returns:
    get:
      operationId: returnsList
      tags: [business]
      summary: List the shop's return/rework cases
      responses:
        "200":
          description: Return cases, newest first
          content:
            application/json:
              schema:
                type: object
                properties:
                  returns:
                    type: array
                    items: { $ref: "#/components/schemas/RepairReturn" }
                required: [returns]
  /returns/{id}:
    get:
      operationId: returnsGet
      tags: [business]
      summary: Get a return case with its parts and refunds
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Return case detail
          content:
            application/json:
              schema:
                type: object
                properties:
                  return: { $ref: "#/components/schemas/RepairReturn" }
                  parts:
                    type: array
                    items: { $ref: "#/components/schemas/ReturnPart" }
                  refunds:
                    type: array
                    items: { $ref: "#/components/schemas/Refund" }
                required: [return, parts, refunds]
    patch:
      operationId: returnsUpdate
      tags: [business]
      summary: Update a return case (status, inspection, resolution; some transitions dealer-only)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReturnUpdateInput"
      responses:
        "200":
          description: Updated return case
          content:
            application/json:
              schema:
                type: object
                properties:
                  return: { $ref: "#/components/schemas/RepairReturn" }
                required: [return]
  /returns/{id}/parts:
    post:
      operationId: returnPartsAdd
      tags: [business]
      summary: Record a part used in rework (deducts inventory)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReturnPartInput"
      responses:
        "200":
          description: Added part
          content:
            application/json:
              schema:
                type: object
                properties:
                  part: { $ref: "#/components/schemas/ReturnPart" }
                required: [part]
  /returns/{id}/refunds:
    post:
      operationId: refundsCreate
      tags: [business]
      summary: Request a refund for a return (staff → pending approval; dealer → approved)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefundCreateInput"
      responses:
        "200":
          description: Created refund
          content:
            application/json:
              schema:
                type: object
                properties:
                  refund: { $ref: "#/components/schemas/Refund" }
                required: [refund]
  /refunds:
    get:
      operationId: refundsList
      tags: [business]
      summary: List the shop's refunds
      responses:
        "200":
          description: Refunds, newest first
          content:
            application/json:
              schema:
                type: object
                properties:
                  refunds:
                    type: array
                    items: { $ref: "#/components/schemas/Refund" }
                  pendingCount: { type: number }
                required: [refunds, pendingCount]
  /refunds/{id}/approve:
    post:
      operationId: refundsApprove
      tags: [business]
      summary: Approve a pending refund, optionally adjusting the amount (dealer only)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefundApproveInput"
      responses:
        "200":
          description: Approved refund
          content:
            application/json:
              schema:
                type: object
                properties:
                  refund: { $ref: "#/components/schemas/Refund" }
                required: [refund]
  /refunds/{id}/reject:
    post:
      operationId: refundsReject
      tags: [business]
      summary: Reject a pending refund with a reason (dealer only)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefundRejectInput"
      responses:
        "200":
          description: Rejected refund
          content:
            application/json:
              schema:
                type: object
                properties:
                  refund: { $ref: "#/components/schemas/Refund" }
                required: [refund]
  /refunds/{id}/mark-paid:
    post:
      operationId: refundsMarkPaid
      tags: [business]
      summary: Mark an approved refund as paid — records the REFUND expense in finance (dealer only)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefundMarkPaidInput"
      responses:
        "200":
          description: Paid refund
          content:
            application/json:
              schema:
                type: object
                properties:
                  refund: { $ref: "#/components/schemas/Refund" }
                required: [refund]
  /approvals:
    get:
      operationId: approvalsList
      tags: [business]
      summary: List backdated-entry approval requests (dealer sees all of the shop's; staff see their own)
      responses:
        "200":
          description: Approval requests, newest first
          content:
            application/json:
              schema:
                type: object
                properties:
                  approvals:
                    type: array
                    items:
                      $ref: "#/components/schemas/ApprovalRequest"
                  pendingCount: { type: number }
                required: [approvals, pendingCount]
    post:
      operationId: approvalsCreate
      tags: [business]
      summary: Request dealer approval for a backdated record
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApprovalRequestInput"
      responses:
        "200":
          description: Created request
          content:
            application/json:
              schema:
                type: object
                properties:
                  approval:
                    $ref: "#/components/schemas/ApprovalRequest"
                required: [approval]
  /approvals/{id}/approve:
    post:
      operationId: approvalsApprove
      tags: [business]
      summary: Approve a pending backdated request and save the record (dealer only)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Approved request
          content:
            application/json:
              schema:
                type: object
                properties:
                  approval:
                    $ref: "#/components/schemas/ApprovalRequest"
                required: [approval]
  /approvals/{id}/reject:
    post:
      operationId: approvalsReject
      tags: [business]
      summary: Reject a pending backdated request (dealer only)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApprovalRejectInput"
      responses:
        "200":
          description: Rejected request
          content:
            application/json:
              schema:
                type: object
                properties:
                  approval:
                    $ref: "#/components/schemas/ApprovalRequest"
                required: [approval]
  /storage/uploads/request-url:
    post:
      tags: [Storage]
      operationId: requestUploadUrl
      summary: Request a presigned URL for file upload
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UploadUrlRequest'
      responses:
        '200':
          description: Presigned upload URL generated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadUrlResponse'
        '400':
          description: Missing or invalid required fields.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /storage/objects/{objectPath}:
    get:
      tags: [Storage]
      operationId: getStorageObject
      summary: Serve an object entity from PRIVATE_OBJECT_DIR
      parameters:
        - name: objectPath
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Object content streamed with correct Content-Type.
          content:
            '*/*':
              schema: { type: string, format: binary }
        '404':
          description: Object not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /inventory:
    get:
      operationId: inventoryList
      tags: [business]
      summary: List inventory items of the caller's shop
      responses:
        "200":
          description: Inventory items
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/InventoryItem"
                required: [items]
    post:
      operationId: inventoryCreate
      tags: [business]
      summary: Create an inventory item in the caller's shop
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InventoryItemInput"
      responses:
        "200":
          description: Created inventory item
          content:
            application/json:
              schema:
                type: object
                properties:
                  item:
                    $ref: "#/components/schemas/InventoryItem"
                required: [item]
  /inventory/{id}:
    patch:
      operationId: inventoryUpdate
      tags: [business]
      summary: Update an inventory item in the caller's shop
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InventoryItemInput"
      responses:
        "200":
          description: Updated inventory item
          content:
            application/json:
              schema:
                type: object
                properties:
                  item:
                    $ref: "#/components/schemas/InventoryItem"
                required: [item]
  /purchases:
    get:
      operationId: purchasesList
      tags: [business]
      summary: List purchases of the caller's shop
      responses:
        "200":
          description: Purchases
          content:
            application/json:
              schema:
                type: object
                properties:
                  purchases:
                    type: array
                    items:
                      $ref: "#/components/schemas/Purchase"
                required: [purchases]
    post:
      operationId: purchasesCreate
      tags: [business]
      summary: Record a purchase in the caller's shop
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PurchaseInput"
      responses:
        "200":
          description: Created purchase
          content:
            application/json:
              schema:
                type: object
                properties:
                  purchase:
                    $ref: "#/components/schemas/Purchase"
                required: [purchase]
  /purchases/{id}:
    patch:
      operationId: purchasesUpdate
      tags: [business]
      summary: Update a purchase in the caller's shop
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PurchaseInput"
      responses:
        "200":
          description: Updated purchase
          content:
            application/json:
              schema:
                type: object
                properties:
                  purchase:
                    $ref: "#/components/schemas/Purchase"
                required: [purchase]
  /finance:
    get:
      operationId: financeList
      tags: [business]
      summary: List finance entries of the caller's shop
      responses:
        "200":
          description: Finance entries
          content:
            application/json:
              schema:
                type: object
                properties:
                  entries:
                    type: array
                    items:
                      $ref: "#/components/schemas/FinanceEntry"
                required: [entries]
    post:
      operationId: financeCreate
      tags: [business]
      summary: Record a finance entry in the caller's shop
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FinanceEntryInput"
      responses:
        "200":
          description: Created finance entry
          content:
            application/json:
              schema:
                type: object
                properties:
                  entry:
                    $ref: "#/components/schemas/FinanceEntry"
                required: [entry]
  /finance/{id}:
    patch:
      operationId: financeUpdate
      tags: [business]
      summary: Update a finance entry in the caller's shop
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FinanceEntryInput"
      responses:
        "200":
          description: Updated finance entry
          content:
            application/json:
              schema:
                type: object
                properties:
                  entry:
                    $ref: "#/components/schemas/FinanceEntry"
                required: [entry]
  /sample-data:
    post:
      operationId: sampleDataLoad
      tags: [business]
      summary: Seed labelled sample data into the caller's shop
      responses:
        "200":
          description: Sample data loaded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
        "409":
          description: Sample data already loaded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
    delete:
      operationId: sampleDataClear
      tags: [business]
      summary: Remove all sample data from the caller's shop
      responses:
        "200":
          description: Sample data cleared
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
components:
  schemas:
    LoginInput:
      type: object
      properties:
        emailOrMobile: { type: string }
        password: { type: string }
        rememberMe: { type: boolean }
        device: { type: string }
      required: [emailOrMobile, password]
    ForgotRequestInput:
      type: object
      properties:
        email: { type: string }
      required: [email]
    ForgotResetInput:
      type: object
      properties:
        email: { type: string }
        resetToken: { type: string }
        newPassword: { type: string }
      required: [email, resetToken, newPassword]
    OtpRequestInput:
      type: object
      properties:
        mobile: { type: string }
      required: [mobile]
    OtpVerifyInput:
      type: object
      properties:
        mobile: { type: string }
        code: { type: string }
        rememberMe: { type: boolean }
        device: { type: string }
      required: [mobile, code]
    RegisterStartInput:
      type: object
      properties:
        name: { type: string }
        businessName: { type: string }
        email: { type: string }
        mobile: { type: string }
        password: { type: string }
        gstNumber: { type: string }
        shopAddress: { type: string }
        role:
          type: string
          enum: [dealer, reception, technician, store_manager, accountant]
        dealerMobile: { type: string }
      required: [name, email, mobile, password]
    RegisterVerifyInput:
      type: object
      properties:
        email: { type: string }
        code: { type: string }
      required: [email, code]
    LoginEvent:
      type: object
      properties:
        id: { type: string }
        method: { type: string }
        rememberMe: { type: boolean }
        deviceInfo: { type: string }
        createdAt: { type: string }
      required: [id, method, rememberMe, createdAt]
    SessionInfo:
      type: object
      properties:
        id: { type: string }
        deviceInfo: { type: string }
        createdAt: { type: string }
        expiresAt: { type: string }
        current: { type: boolean }
      required: [id, createdAt, expiresAt, current]
    Message:
      type: object
      properties:
        message: { type: string }
      required: [message]
    AuthUser:
