        "200":
          description: Block state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatBlockResult"
        "404":
          description: Room not found or not a global direct room
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
    delete:
      operationId: chatRoomsUnblock
      tags: [chat]
      summary: Remove the caller's block on the other member of a global direct room
      parameters:
        - name: roomId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Block state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatBlockResult"
        "404":
          description: Room not found or not a global direct room
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"

  /chat/rooms/{roomId}/reports:
    post:
      operationId: chatReportsCreate
      tags: [chat]
      summary: Report the other member of a global direct room
      parameters:
        - name: roomId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChatReportInput"
      responses:
        "200":
          description: Report accepted
          content:
            application/json:
              schema:
                type: object
                properties:
                  report:
                    $ref: "#/components/schemas/ChatReport"
                required: [report]
        "400":
          description: Invalid reason, details, or message reference
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
        "404":
          description: Room not found or not a global direct room
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"

  /chat/reports/mine:
    get:
      operationId: chatMyReportList
      tags: [chat]
      security:
        - bearerAuth: []
      summary: List the abuse reports the caller filed
      description: >-
        The reporter's own record of what they reported, so they can check
        whether an older report was handled instead of filing it again. Scoped
        to the caller: it never returns another user's report, and it carries
        none of the operator-only queue data — no reviewer, no review note, and
        no indication of what happened to the reported account. Progress is a
        single flag: still with reviewers, or finished.
      parameters:
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 50 } }
        - { name: cursor, in: query, required: false, schema: { type: string } }
      responses:
        "200":
          description: The caller's own reports, newest first
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatMyReportList"
        "400":
          description: Invalid limit or cursor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
        "401": { description: Authentication required }

  # ── Chat abuse report moderation (platform operators only) ───────────────────
  /chat/admin/reports:
    get:
      operationId: chatAdminReportList
      tags: [chat]
      security:
        - bearerAuth: []
      summary: List chat abuse reports for platform operators
      parameters:
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 100 } }
        - { name: cursor, in: query, required: false, schema: { type: string } }
        - name: status
          in: query
          required: false
          schema: { $ref: "#/components/schemas/ChatReportStatus" }
        - name: search
          in: query
          required: false
          description: >-
            Free-text match against the reporter or the reported user. A term is
            read as one thing or the other, never both: a term containing any
            letter is matched against names only, and a term of digits and phone
            punctuation is matched against mobiles only, ignoring spacing and
            country-code formatting on either side. A term with neither a letter
            nor at least three digits matches nothing.
          schema: { type: string, maxLength: 64 }
        - name: reportedUserId
          in: query
          required: false
          description: >-
            Only reports naming this exact account as the reported user. This is
            what otherOpenReports counts, so it is the filter to use when
            drilling into an account's other open reports.
          # A pattern rather than `format: uuid`: Orval turns the format into a
          # Zod 4-only validator while api-zod is still on Zod 3.
          schema:
            type: string
            pattern: "^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$"
      responses:
        "200":
          description: Abuse report queue, newest first
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatReportList"
        "400":
          description: Invalid queue filters or cursor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
        "401": { description: Authentication required }
        "403": { description: Platform operator required }
  /chat/admin/reports/{id}/transcript:
    get:
      operationId: chatAdminReportTranscript
      tags: [chat]
      security:
        - bearerAuth: []
      summary: Read the reported conversation around a chat abuse report
      description: >-
        Operator-only, read-only view of the reported room. The operator is not
        joined to the room and nothing is marked as read. Each call is recorded
        as a transcript access.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 200 } }
      responses:
        "200":
          description: Messages surrounding the reported message, oldest first
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatReportTranscript"
        "400":
          description: Invalid transcript window
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
        "401": { description: Authentication required }
        "403": { description: Platform operator required }
        "404":
          description: Report not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
  /chat/admin/reports/{id}/status:
    patch:
      operationId: chatAdminReportStatusUpdate
      tags: [chat]
      security:
        - bearerAuth: []
      summary: Record an operator decision on a chat abuse report
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChatReportReviewInput"
      responses:
        "200":
          description: Updated report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatReportQueueItemResponse"
        "400":
          description: Invalid review decision
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
        "401": { description: Authentication required }
        "403": { description: Platform operator required }
        "404":
          description: Report not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
        "409":
          description: Illegal review transition
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
  /chat/admin/reports/{id}/status/batch:
    post:
      operationId: chatAdminReportStatusBatch
      tags: [chat]
      security:
        - bearerAuth: []
      summary: Record one decision across every open report about the same account
      description: >-
        Applies the decision to this report and to every other report that is
        still open against the same reported user, as one transaction. Each
        report keeps its own row, deciding operator, decision time and note, so
        the audit trail stays per-report. Reports about that account which are
        no longer open — already settled, or already moved by another operator —
        are skipped, never overwritten, and a report filed after the batch
        started is untouched. Each reporter receives at most one alert for the
        batch, with the same wording a single decision sends.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChatReportReviewInput"
      responses:
        "200":
          description: The decided report, with how far the batch reached
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatReportBatchDecision"
        "400":
          description: Invalid review decision
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
        "401": { description: Authentication required }
        "403": { description: Platform operator required }
        "404":
          description: Report not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
        "409":
          description: Illegal review transition on this report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
  /chat/admin/reports/batches/{batchId}/withdraw:
    post:
      operationId: chatAdminReportBatchWithdraw
      tags: [chat]
      security:
        - bearerAuth: []
      summary: Withdraw a bulk decision within its short recovery window
      description: >-
        Puts every report this batch moved back to the exact state it was in
        beforehand — its own earlier status, deciding operator and note — and
        records who withdrew it and when. Only the operator who recorded the
        batch may withdraw it, and only within a short window of recording it;
        anyone else, a second withdrawal, or a lapsed window is refused. A
        report another operator has decided since the batch is left with their
        decision and counted as skipped. Nothing is sent to the reporters: the
        alerts the batch already sent stand, and a withdrawal is not announced
        to the people the operator queue is kept from.
      parameters:
        - name: batchId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: The batch was withdrawn and its reports restored
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatReportBatchWithdrawal"
        "401": { description: Authentication required }
        "403":
          description: Recorded by a different operator
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
        "404":
          description: Batch decision not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
        "409":
          description: Already withdrawn, or the withdrawal window has passed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"

  # ── Chat messages ────────────────────────────────────────────────────────────
  /chat/rooms/{roomId}/messages:
    get:
      operationId: chatMessagesList
      tags: [chat]
      summary: List messages in a room (newest-first, paginated)
      parameters:
        - name: roomId
          in: path
          required: true
          schema: { type: string }
        - { name: before, in: query, required: false, schema: { type: string }, description: "Cursor: createdAt of the oldest loaded message" }
        - { name: limit, in: query, required: false, schema: { type: number } }
      responses:
        "200":
          description: Messages
          content:
            application/json:
              schema:
                type: object
                properties:
                  messages:
                    type: array
                    items:
                      $ref: "#/components/schemas/ChatMessage"
                  hasMore: { type: boolean }
                required: [messages, hasMore]
    post:
      operationId: chatMessagesSend
      tags: [chat]
      summary: Send a message to a room (idempotent on clientRequestId)
      parameters:
        - name: roomId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChatMessageSendInput"
      responses:
        "200":
          description: Created or existing (idempotent) message
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    $ref: "#/components/schemas/ChatMessage"
                required: [message]
        "400":
          description: Missing/invalid fields (including clientRequestId)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
        "503":
          description: Chat provider unavailable — message not delivered or stored
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceUnavailable"

  # ── Message deletion ─────────────────────────────────────────────────────────
  /chat/rooms/{roomId}/messages/delete:
    post:
      operationId: chatMessagesDelete
      tags: [chat]
      summary: Delete messages for the caller only, or for everyone (own messages)
      description: >
        scope=me hides the messages from the caller's transcript only; the shared
        message and the other member's copy are untouched. scope=everyone is
        allowed only when every listed message was sent by the caller AND is
        less than 24 hours old (403 CHAT_DELETE_WINDOW_EXPIRED otherwise); the
        provider event is redacted first, then the row becomes a tombstone that
        every member sees as "Message deleted" and whose media is unreachable.
      parameters:
        - name: roomId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChatMessagesDeleteInput"
      responses:
        "200":
          description: Messages deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  deletedIds:
                    type: array
                    items: { type: string }
                required: [deletedIds]
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
        "403":
          description: scope=everyone requested for a message the caller did not send (CHAT_DELETE_NOT_SENDER) or one sent more than 24 hours ago (CHAT_DELETE_WINDOW_EXPIRED)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
        "404":
          description: Room or message not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
        "503":
          description: Chat provider unavailable or a redaction failed part-way — items redacted before the failure stay deleted; refetch messages
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceUnavailable"

  # ── Read markers ─────────────────────────────────────────────────────────────
  /chat/rooms/{roomId}/read:
    post:
      operationId: chatMarkRead
      tags: [chat]
      summary: Update the caller's read marker for a room
      parameters:
        - name: roomId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChatMarkReadInput"
      responses:
        "200":
          description: Read marker updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"

  # ── Private chat upload URL ──────────────────────────────────────────────────
  /chat/rooms/{roomId}/upload-url:
    post:
      operationId: chatUploadUrl
      tags: [chat]
      summary: Request a presigned upload URL for a chat media attachment
      parameters:
        - name: roomId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChatUploadUrlInput"
      responses:
        "200":
          description: Upload URL and object path
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatUploadUrlResult"

  # ── Call tokens ──────────────────────────────────────────────────────────────
  /chat/rooms/{roomId}/call-token:
    post:
      operationId: chatCallToken
      tags: [chat]
      summary: Mint a short-lived LiveKit call token for the caller in this room
      parameters:
        - name: roomId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: LiveKit token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatCallTokenResult"
        "503":
          description: LiveKit credentials not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceUnavailable"

  # ── Chat media download ───────────────────────────────────────────────────────
  /chat/rooms/{roomId}/messages/{messageId}/media:
    get:
      operationId: chatMessageMedia
      tags: [chat]
      summary: >
        Download a chat media attachment. Requires room membership; verifies the
        message belongs to this room and has a non-null objectPath under the
        expected uploads/<shopId>/chat/<roomId>/ prefix. Streams the object
        directly from object storage. Returns 404 for any auth or path failure
        (no information leak).
      parameters:
        - name: roomId
          in: path
          required: true
          schema: { type: string }
        - name: messageId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Media file bytes
          content:
            "*/*":
              schema:
                type: string
                format: binary
        "404":
          description: Room or message not found, or caller not authorised

  # ── Personal Status updates ────────────────────────────────────────────────
  /statuses/upload-url:
    post:
      operationId: statusesUploadUrl
      tags: [status]
      summary: Request a private upload URL for a personal status image or video
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StatusUploadInput"
      responses:
        "200":
          description: Upload URL and personal status object path
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusUploadResult"

  /statuses:
    get:
      operationId: statusesList
      tags: [status]
      summary: List active Status updates from the caller and eligible personal contacts
      responses:
        "200":
          description: Grouped active Status updates
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusFeed"
    post:
      operationId: statusesCreate
      tags: [status]
      summary: Publish a text, image, or video Status update
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StatusCreateInput"
      responses:
        "201":
          description: Published Status update
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusCreateResult"

  /statuses/{id}:
    get:
      operationId: statusesGet
      tags: [status]
      summary: Get an active Status update after server-side visibility checks
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Status update
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusGetResult"
        "404":
          description: Status not found, expired, or not visible to caller
    delete:
      operationId: statusesDelete
      tags: [status]
      summary: Delete the caller's active Status update
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "204":
          description: Status deleted

  /statuses/{id}/view:
    post:
      operationId: statusesView
      tags: [status]
      summary: Mark an eligible Status update as viewed
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: View recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusViewResult"
        "404":
          description: Status not found, expired, or not visible to caller

  /statuses/{id}/viewers:
    get:
      operationId: statusesViewersList
      tags: [status]
      summary: List unique viewers for the caller's active Status update
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Status viewers
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusViewersResult"
        "404":
          description: Status not found or not owned by caller

components:
  parameters:
    PublicRequestId:
      name: id
      in: path
      required: true
      schema: { type: string }
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque
  schemas:
    PublicRequestInput:
      type: object
      required: [kind, name, mobile, message, confirmation]
      properties:
        kind:
          type: string
          enum: [support, account_deletion]
        name:
          type: string
          minLength: 2
          maxLength: 100
        mobile:
          type: string
          pattern: '^[6-9][0-9]{9}$'
        email:
          type: string
          maxLength: 254
        subject:
          type: string
          maxLength: 120
        message:
          type: string
          minLength: 10
          maxLength: 2000
        confirmation:
          type: boolean
          description: >
            For account deletion this confirms the requester understands that
            identity verification is required and the form does not instantly
            delete an account.
        website:
          type: string
          maxLength: 0
          description: Honeypot field; legitimate clients leave this empty.
    PublicRequestReceipt:
      type: object
      required: [requestId, status, message]
      properties:
        requestId:
          type: string
        status:
          type: string
          enum: [received]
        message:
          type: string
    PublicRequestStatus:
      type: string
      enum: [received, in_review, resolved, rejected]
    PublicRequest:
      type: object
      required: [id, kind, requesterName, mobile, message, status, createdAt, reviewedAt, reviewerUserId, confirmationAcceptedAt]
      properties:
        id: { type: string }
        kind: { type: string, enum: [support, account_deletion] }
        requesterName: { type: string }
        mobile: { type: string }
        email: { type: [string, "null"] }
        subject: { type: [string, "null"] }
        message: { type: string }
        status: { $ref: "#/components/schemas/PublicRequestStatus" }
        reviewerUserId: { type: [string, "null"] }
        reviewedAt: { type: [string, "null"], format: date-time }
        confirmationAcceptedAt: { type: [string, "null"], format: date-time }
        createdAt: { type: string, format: date-time }
    PublicRequestQueueItem:
      type: object
      required: [id, kind, requesterName, mobile, subject, status, createdAt]
      properties:
        id: { type: string }
        kind: { type: string, enum: [support, account_deletion] }
        requesterName: { type: string }
        mobile: { type: string }
        subject: { type: [string, "null"] }
        status: { $ref: "#/components/schemas/PublicRequestStatus" }
        createdAt: { type: string, format: date-time }
    PublicRequestTransition:
      type: object
      required: [id, fromStatus, toStatus, note, reviewerUserId, createdAt]
      properties:
        id: { type: string }
        fromStatus: { $ref: "#/components/schemas/PublicRequestStatus" }
        toStatus: { $ref: "#/components/schemas/PublicRequestStatus" }
        note: { type: [string, "null"] }
        reviewerUserId: { type: string }
        reviewerName: { type: [string, "null"] }
        createdAt: { type: string, format: date-time }
    PublicRequestList:
      type: object
      required: [requests, nextCursor]
      properties:
        requests:
          type: array
          items: { $ref: "#/components/schemas/PublicRequestQueueItem" }
        nextCursor: { type: [string, "null"] }
    PublicRequestDetail:
      type: object
      required: [request, transitions, identityVerification]
      properties:
        request: { $ref: "#/components/schemas/PublicRequest" }
        transitions:
          type: array
          items: { $ref: "#/components/schemas/PublicRequestTransition" }
        identityVerification:
          oneOf:
            - $ref: "#/components/schemas/PublicRequestIdentityVerification"
            - type: "null"
    PublicRequestStatusUpdate:
      type: object
      required: [status]
      properties:
        status: { $ref: "#/components/schemas/PublicRequestStatus" }
        note: { type: string, minLength: 1, maxLength: 2000 }
    PublicRequestIdentityVerification:
      type: object
      required: [id, reviewerUserId, reviewerName, method, note, createdAt]
      properties:
        id: { type: string }
        reviewerUserId: { type: string }
        reviewerName: { type: [string, "null"] }
        method: { type: string }
        note: { type: string }
        createdAt: { type: string, format: date-time }
    PublicRequestIdentityVerificationInput:
      type: object
      required: [method, note]
      properties:
        method: { type: string, minLength: 2, maxLength: 100 }
        note: { type: string, minLength: 2, maxLength: 2000 }
    PublicContact:
      type: object
      required: [supportEmail]
      properties:
        supportEmail: { type: [string, "null"] }
    SupportNotificationSettings:
      type: object
      required: [recipientEmail, updatedAt, updatedByName, senderConfigured]
      properties:
        recipientEmail: { type: [string, "null"] }
        updatedAt: { type: [string, "null"], format: date-time }
        updatedByName: { type: [string, "null"] }
        senderConfigured:
          type: boolean
          description: >
            True when a verified sender address is configured for outgoing
            mail. When false, alert emails may not be delivered.
    SupportNotificationSettingsInput:
      type: object
      required: [recipientEmail]
      properties:
        recipientEmail:
          type: [string, "null"]
          maxLength: 254
          description: >
            Destination inbox for new public request alerts. Null or an empty
            string turns alert emails off.
    ProfileUpdateInput:
      type: object
      properties:
        name: { type: string }
        mobile:
          type: string
          description: >-
            Deprecated. The sign-in mobile is immutable here; sending a value
            other than the current one fails with 400 MOBILE_CHANGE_REQUIRES_OTP.
            Only a verified OTP binds a number.
          deprecated: true
        profilePhoto: { type: string, nullable: true }
        profileAbout: { type: string, nullable: true, maxLength: 500 }
        profileUsername: { type: string, nullable: true, pattern: '^[a-z0-9][a-z0-9_]{2,29}$' }
        profileLinks:
          type: array
          nullable: true
          maxItems: 8
          items: { type: string, maxLength: 2048 }
    NotificationsReadInput:
      type: object
      properties:
        ids:
          type: array
          items: { type: string }
    AppNotification:
      type: object
      properties:
        id: { type: string }
        type: { type: string }
        title: { type: string }
        body: { type: string }
        data: {}
        read: { type: boolean }
        createdAt: { type: string }
      required: [id, type, title, body, read, createdAt]
    PushTokenInput:
      type: object
      properties:
        token: { type: string }
        platform: { type: string, enum: [ios, android] }
        deviceInfo: { type: string }
      required: [token, platform]
    PushTokenUnregisterInput:
      type: object
      properties:
        token: { type: string }
      required: [token]
    RoleFeaturesInput:
      type: object
      properties:
        features:
          $ref: "#/components/schemas/FeatureMap"
      required: [features]
    FeatureMap:
      type: object
      additionalProperties: { type: boolean }
    CanonicalPermissionMap:
      type: object
      description: Canonical permissions derived from the effective legacy feature matrix.
      properties:
        VIEW_KHATA: { type: boolean }
        EDIT_KHATA: { type: boolean }
        VIEW_REPAIR: { type: boolean }
        EDIT_REPAIR: { type: boolean }
        VIEW_BUSINESS_REPORTS: { type: boolean }
        MANAGE_STAFF: { type: boolean }
        MANAGE_BUSINESS_SETTINGS: { type: boolean }
      required: [VIEW_KHATA, EDIT_KHATA, VIEW_REPAIR, EDIT_REPAIR, VIEW_BUSINESS_REPORTS, MANAGE_STAFF, MANAGE_BUSINESS_SETTINGS]
    IndividualFeatureChanges:
      type: object
      additionalProperties:
        type: [boolean, "null"]
    IndividualFeaturesInput:
      type: object
      properties:
        features:
          $ref: "#/components/schemas/IndividualFeatureChanges"
      required: [features]
    IndividualPermissions:
      type: object
      properties:
        user:
          $ref: "#/components/schemas/AuthUser"
        availableFeatures:
          type: array
          items: { type: string }
        roleFeatures:
          $ref: "#/components/schemas/FeatureMap"
        overrides:
          $ref: "#/components/schemas/FeatureMap"
        features:
          $ref: "#/components/schemas/FeatureMap"
        permissions:
          description: Canonical derived permissions, returned alongside legacy feature fields.
          $ref: "#/components/schemas/CanonicalPermissionMap"
      required: [user, availableFeatures, roleFeatures, overrides, features, permissions]
    AppUpdate:
      type: object
      properties:
        id: { type: string }
        version: { type: string }
        buildNumber: { type: number }
        releaseDate: { type: [string, "null"] }
        apkSize: { type: [number, "null"] }
        checksum: { type: [string, "null"] }
        updateType: { type: string }
        minAndroidVersion: { type: [string, "null"] }
        releaseNotes: {}
        screenshots: {}
        demoVideoUrl: { type: [string, "null"] }
        publishedAt: { type: [string, "null"] }
        apkUrl: { type: [string, "null"] }
      required: [id, version, buildNumber, updateType]
    AppUpdateAdmin:
      allOf:
        - $ref: "#/components/schemas/AppUpdate"
        - type: object
          properties:
            status: { type: string }
            downloadCount: { type: number }
            checkCount: { type: number }
            publishedByName: { type: [string, "null"] }
            createdAt: { type: string }
            apkPath: { type: [string, "null"] }
          required: [status, downloadCount, createdAt]
    AppUpdateInput:
      type: object
      properties:
        version: { type: string }
        buildNumber: { type: number }
        releaseDate: { type: [string, "null"] }
        apkPath: { type: [string, "null"] }
        updateType: { type: string, enum: [optional, recommended, critical] }
        minAndroidVersion: { type: [string, "null"] }
        releaseNotes: {}
        screenshots: {}
        demoVideoUrl: { type: [string, "null"] }
    AppUpdatePublishInput:
      type: object
      properties:
        allowLowerBuild: { type: boolean }
    AppUpdateStats:
      type: object
      properties:
        totalReleases: { type: number }
        publishedCount: { type: number }
        draftCount: { type: number }
        totalDownloads: { type: number }
        totalUpdateChecks: { type: number }
        currentVersion: { type: [string, "null"] }
        currentBuildNumber: { type: [number, "null"] }
        currentPublishedAt: { type: [string, "null"] }
        currentDownloadCount: { type: [number, "null"] }
      required:
        - totalReleases
        - publishedCount
        - draftCount
        - totalDownloads
        - totalUpdateChecks
    AppUpdateEnvelope:
      type: object
      properties:
        update:
          allOf:
            - $ref: "#/components/schemas/AppUpdate"
            - type: object
              properties:
                status: { type: string }
      required: [update]
    DashboardStats:
      type: object
      properties:
        todayRepairs: { type: number }
        pendingRepairs: { type: number }
        readyForPickup: { type: number }
        totalCustomers: { type: number }
        openApprovalRequests: { type: number }
        openReturnCases: { type: number }
        canSeeFinance: { type: boolean }
        todayIncome: { type: number }
        todayExpense: { type: number }
        todayRepairIncome: { type: number }
        todayProductIncome: { type: number }
        pendingPayments: { type: number }
        readyBalance: { type: number }
        refundsTotal: { type: number }
        refundsToday: { type: number }
      required:
        - todayRepairs
        - pendingRepairs
        - readyForPickup
        - totalCustomers
        - openApprovalRequests
        - openReturnCases
        - canSeeFinance
    Activity:
      type: object
      properties:
        id: { type: string }
        type: { type: string, enum: [repair, login] }
        action: { type: string }
        userId: { type: string, nullable: true }
        userName: { type: string }
        userRole: { type: string }
        repairId: { type: string, nullable: true }
        details: { type: object, nullable: true, additionalProperties: true }
        createdAt: { type: string }
      required: [id, type, action, userName, userRole, createdAt]
    OtpRequestInput:
      type: object
      properties:
        mobile: { type: string }
