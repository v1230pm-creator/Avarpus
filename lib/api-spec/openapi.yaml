        reports:
          type: array
          items: { $ref: "#/components/schemas/ChatMyReport" }
        nextCursor: { type: [string, "null"] }
      required: [reports, nextCursor]
    ChatReportParty:
      type: object
      properties:
        id: { type: string }
        name: { type: [string, "null"] }
        mobile: { type: [string, "null"] }
      required: [id, name, mobile]
    ChatReportRoom:
      type: object
      properties:
        id: { type: string }
        name: { type: [string, "null"] }
        scope: { type: [string, "null"] }
      required: [id, name, scope]
    ChatReportQueueItem:
      type: object
      properties:
        id: { type: string }
        reason:
          $ref: "#/components/schemas/ChatReportReason"
        details: { type: [string, "null"] }
        status:
          $ref: "#/components/schemas/ChatReportStatus"
        createdAt: { type: string, format: date-time }
        reporter:
          $ref: "#/components/schemas/ChatReportParty"
        reportedUser:
          $ref: "#/components/schemas/ChatReportParty"
        room:
          $ref: "#/components/schemas/ChatReportRoom"
        messageId: { type: [string, "null"] }
        reviewerUserId: { type: [string, "null"] }
        reviewerName: { type: [string, "null"] }
        reviewedAt: { type: [string, "null"], format: date-time }
        reviewNote: { type: [string, "null"] }
        # How many OTHER reports naming this same reported user are still open,
        # excluding this report. Lets an operator spot one account attracting
        # complaints from several different people.
        # type: integer makes Orval emit z.int(), which is Zod 4-only while
        # lib/api-zod is still on Zod 3.
        otherOpenReports: { type: number }
      required:
        - id
        - reason
        - details
        - status
        - createdAt
        - reporter
        - reportedUser
        - room
        - messageId
        - reviewerUserId
        - reviewerName
        - reviewedAt
        - reviewNote
        - otherOpenReports
    ChatReportQueueItemResponse:
      type: object
      properties:
        report:
          $ref: "#/components/schemas/ChatReportQueueItem"
      required: [report]
    ChatReportBatchDecision:
      type: object
      properties:
        report:
          $ref: "#/components/schemas/ChatReportQueueItem"
        # Reports this decision actually moved, counting the one it was recorded
        # from. type: integer makes Orval emit z.int(), which is Zod 4-only
        # while lib/api-zod is still on Zod 3.
        appliedCount: { type: number }
        # Other reports about the same account that were left exactly as they
        # were, because they were no longer open.
        skippedCount: { type: number }
        # Distinct reporters alerted. A reporter who filed several of the
        # batched reports is told once, not once per report.
        notifiedReporterCount: { type: number }
        # The handle this bulk decision is withdrawn by, and the moment the
        # offer lapses. Present on every batch, including one that reached a
        # single report: the caller cannot know its reach in advance.
        batchId: { type: string }
        withdrawableUntil: { type: string, format: date-time }
      required:
        - report
        - appliedCount
        - skippedCount
        - notifiedReporterCount
        - batchId
        - withdrawableUntil
    ChatReportBatchWithdrawal:
      type: object
      properties:
        batchId: { type: string }
        withdrawnAt: { type: string, format: date-time }
        # The reports actually put back, in id order.
        restoredReportIds:
          type: array
          items: { type: string }
        # type: integer makes Orval emit z.int(), which is Zod 4-only while
        # lib/api-zod is still on Zod 3.
        restoredCount: { type: number }
        # Reports the batch had moved that this withdrawal left alone, because
        # another operator has decided them since.
        skippedCount: { type: number }
      required:
        - batchId
        - withdrawnAt
        - restoredReportIds
        - restoredCount
        - skippedCount
    ChatReportList:
      type: object
      properties:
        reports:
          type: array
          items: { $ref: "#/components/schemas/ChatReportQueueItem" }
        nextCursor: { type: [string, "null"] }
        # type: integer makes Orval emit z.int(), which is Zod 4-only while
        # lib/api-zod is still on Zod 3.
        openCount: { type: number }
      required: [reports, nextCursor, openCount]
    ChatReportTranscriptMessage:
      type: object
      properties:
        id: { type: string }
        senderId: { type: string }
        senderName: { type: string }
        kind: { type: string }
        body: { type: string }
        hasAttachment: { type: boolean }
        deletedAt: { type: [string, "null"], format: date-time }
        createdAt: { type: string, format: date-time }
        isReportedMessage: { type: boolean }
        isFromReportedUser: { type: boolean }
      required:
        - id
        - senderId
        - senderName
        - kind
        - body
        - hasAttachment
        - deletedAt
        - createdAt
        - isReportedMessage
        - isFromReportedUser
    ChatReportTranscript:
      type: object
      properties:
        reportId: { type: string }
        room:
          $ref: "#/components/schemas/ChatReportRoom"
        reportedMessageId: { type: [string, "null"] }
        # False when the report named a message that no longer exists, in which
        # case the window is the tail of the conversation instead.
        reportedMessageFound: { type: boolean }
        messages:
          type: array
          items: { $ref: "#/components/schemas/ChatReportTranscriptMessage" }
        hasMoreBefore: { type: boolean }
        hasMoreAfter: { type: boolean }
      required:
        - reportId
        - room
        - reportedMessageId
        - reportedMessageFound
        - messages
        - hasMoreBefore
        - hasMoreAfter
    ChatReportReviewInput:
      type: object
      properties:
        status:
          type: string
          enum: [reviewed, actioned, dismissed]
        note: { type: string, minLength: 1, maxLength: 2000 }
      required: [status]
    ChatRoomCreateInput:
      type: object
      description: >
        Create (or return existing) a one-to-one chat room. kind=customer
        requires customerId (must have exactly one active customer user link).
        kind=dealer requires dealerId (same shop) and resolves exactly one active
        dealer-portal target. kind=direct creates a global, membership-only room
        and requires targetUserId plus the exact-phone matchToken. support/group
        kinds are out of scope (400).
      properties:
        name: { type: string }
        kind: { type: string, enum: [customer, dealer, direct] }
        customerId: { type: string }
        dealerId: { type: string }
        targetUserId: { type: string }
        matchToken:
          type: string
          description: Required with kind=direct; obtained from /chat/contacts/match.
        clientRequestId: { type: string }
      required: [name, kind]
    ChatMessage:
      type: object
      properties:
        id: { type: string }
        roomId: { type: string }
        shopId: { type: ["string", "null"] }
        senderId: { type: string }
        senderName: { type: string }
        kind: { type: string, enum: [text, image, video, file, audio, system] }
        body: { type: string }
        objectPath: { type: string }
        mimeType:
          type: string
          description: >
            MIME type of the stored attachment as verified by the server at send
            time (image/video/file/audio kinds). Absent for text and legacy rows.
        sizeBytes:
          type: number
          description: Integer byte size of the stored attachment, when known.
        durationMs:
          type: number
          description: >
            Integer duration in milliseconds. Only set for kind=audio (voice notes).
        clientRequestId: { type: string }
        replyTo:
          $ref: "#/components/schemas/ChatMessageQuote"
        forwarded:
          type: boolean
          description: True when this message was forwarded from another message.
        deletedAt:
          type: string
          description: >
            Set when the sender deleted the message for everyone. The row is a
            tombstone: body is empty and media is unreachable.
        createdAt: { type: string }
      required: [id, roomId, shopId, senderId, senderName, kind, body, createdAt]
    ChatMessageQuote:
      type: object
      description: >
        Snapshot of the message being replied to. Media for a quoted image/video/
        file/audio is served from the quoted message's own media endpoint.
      properties:
        id: { type: string }
        senderId: { type: string }
        senderName: { type: string }
        kind: { type: string, enum: [text, image, video, file, audio, system] }
        body: { type: string }
        deleted:
          type: boolean
          description: True when the quoted message is no longer available.
      required: [id, senderId, senderName, kind, body, deleted]
    ChatMessageForwardSource:
      type: object
      description: Message to copy when forwarding. The caller must be a member of roomId.
      properties:
        roomId: { type: string }
        messageId: { type: string }
      required: [roomId, messageId]
    ChatMessageSendInput:
      type: object
      description: >
        Send a message. clientRequestId is REQUIRED and must be stable across
        retries; the server dedupes on (roomId, senderId, clientRequestId) and
        derives the Matrix transaction id deterministically so retries never
        create a second row nor a second provider event.
        For kind=audio a room-scoped objectPath and an integer durationMs
        (1..600000) are REQUIRED; durationMs must be omitted for non-audio kinds.
        With forwardOf the kind, body, media and duration are copied from the
        source message (media is duplicated into the target room's storage
        scope); the supplied kind must match the source kind and objectPath /
        durationMs must be omitted. replyToMessageId must name a visible
        message in the same room; it cannot be combined with forwardOf.
      properties:
        kind: { type: string, enum: [text, image, video, file, audio] }
        body: { type: string }
        objectPath: { type: string }
        durationMs:
          type: number
          minimum: 1
          maximum: 600000
          description: >
            Integer voice-note duration in milliseconds. REQUIRED for kind=audio;
            must be omitted for other kinds.
        clientRequestId: { type: string }
        replyToMessageId:
          type: string
          description: ID of a message in the same room this message replies to.
        forwardOf:
          $ref: "#/components/schemas/ChatMessageForwardSource"
      required: [kind, body, clientRequestId]
    ChatMessagesDeleteInput:
      type: object
      properties:
        messageIds:
          type: array
          items: { type: string }
          minItems: 1
          maxItems: 50
        scope:
          type: string
          enum: [me, everyone]
      required: [messageIds, scope]
    ChatMarkReadInput:
      type: object
      properties:
        messageId: { type: string }
      required: [messageId]
    ChatUploadUrlInput:
      type: object
      description: >
        Any file type may be attached (photos, videos, documents, archives, APKs,
        ...). contentType is a syntactically valid MIME type; unknown types should
        be sent as application/octet-stream. size must be a positive integer of
        at most 100 MiB.
      properties:
        name: { type: string }
        size: { type: number }
        contentType: { type: string }
      required: [name, size, contentType]
    ChatUploadUrlResult:
      type: object
      properties:
        uploadURL: { type: string }
        objectPath: { type: string }
      required: [uploadURL, objectPath]
    ChatCallTokenResult:
      type: object
      properties:
        token: { type: string }
        url: { type: string }
        roomName: { type: string }
        expiresIn: { type: number }
      required: [token, url, roomName, expiresIn]
    StatusUploadInput:
      type: object
      properties:
        name: { type: string, minLength: 1 }
        size: { type: number, minimum: 1, maximum: 67108864 }
        contentType: { type: string }
      required: [name, size, contentType]
    StatusUploadResult:
      type: object
      properties:
        uploadURL: { type: string }
        objectPath: { type: string }
        maxSize: { type: number }
        kind: { type: string, enum: [image, video] }
      required: [uploadURL, objectPath, maxSize, kind]
    StatusCreateInput:
      type: object
      properties:
        kind: { type: string, enum: [text, image, video] }
        body: { type: [string, "null"], maxLength: 7000 }
        objectPath: { type: [string, "null"] }
        mimeType: { type: [string, "null"] }
        sizeBytes: { type: [number, "null"], minimum: 1, maximum: 67108864 }
        audience: { type: string, enum: [contacts, nobody], default: contacts }
      required: [kind]
    StatusItem:
      type: object
      properties:
        id: { type: string }
        authorId: { type: string }
        authorName: { type: string }
        authorPhoto: { type: [string, "null"] }
        kind: { type: string, enum: [text, image, video] }
        body: { type: [string, "null"] }
        objectPath: { type: [string, "null"] }
        mediaUrl: { type: [string, "null"] }
        mimeType: { type: [string, "null"] }
        sizeBytes: { type: [number, "null"] }
        createdAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
        viewed: { type: boolean }
        viewerCount:
          type: number
          description: Total unique viewers for the author's own status; always 0 for other authors.
      required: [id, authorId, authorName, authorPhoto, kind, body, objectPath, mediaUrl, mimeType, createdAt, expiresAt, viewed, viewerCount]
    StatusGroup:
      type: object
      properties:
        userId: { type: string }
        name: { type: string }
        profilePhoto: { type: [string, "null"] }
        hasUnviewed: { type: boolean }
        latestAt: { type: string, format: date-time }
        items:
          type: array
          items:
            $ref: "#/components/schemas/StatusItem"
      required: [userId, name, profilePhoto, hasUnviewed, latestAt, items]
    StatusFeed:
      type: object
      properties:
        groups:
          type: array
          items:
            $ref: "#/components/schemas/StatusGroup"
      required: [groups]
    StatusCreateResult:
      type: object
      properties:
        status:
          $ref: "#/components/schemas/StatusItem"
      required: [status]
    StatusGetResult:
      type: object
      properties:
        status:
          $ref: "#/components/schemas/StatusItem"
      required: [status]
    StatusViewResult:
      type: object
      properties:
        viewedAt: { type: string, format: date-time }
      required: [viewedAt]
    StatusViewer:
      type: object
      properties:
        userId: { type: string }
        name: { type: string }
        profilePhoto: { type: [string, "null"] }
        viewedAt: { type: string, format: date-time }
      required: [userId, name, profilePhoto, viewedAt]
    StatusViewersResult:
      type: object
      properties:
        viewers:
          type: array
          items:
            $ref: "#/components/schemas/StatusViewer"
      required: [viewers]
    ServiceUnavailable:
      type: object
      properties:
        message: { type: string }
        code: { type: string }
      required: [message]
