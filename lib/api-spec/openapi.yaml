    # ── Chat schemas ──────────────────────────────────────────────────────────
    ChatCapabilities:
      type: object
      properties:
        e2eeEnabled: { type: boolean }
        matrixAvailable: { type: boolean }
        livekitAvailable: { type: boolean }
      required: [e2eeEnabled, matrixAvailable, livekitAvailable]
    ChatContactMatchInput:
      type: object
      properties:
        phone:
          type: string
          description: One exact Indian phone number.
        phones:
          type: array
          maxItems: 50
          items: { type: string }
          description: Exact Indian phone numbers read with device contact permission.
    ChatContact:
      type: object
      properties:
        userId: { type: string }
        name: { type: string }
        mobile: { type: string }
        role: { type: string }
        matchToken:
          type: string
          description: Short-lived opaque proof bound to this caller, target, and shop.
        profilePhoto: { type: string }
      required: [userId, name, mobile, role, matchToken]
    ChatRoom:
      type: object
      properties:
        id: { type: string }
        shopId: { type: string }
        kind: { type: string, enum: [customer, dealer, direct] }
        name: { type: string }
        customerId: { type: string }
        dealerId: { type: string }
        providerRoomId: { type: string }
        peerUserId:
          type: string
          description: The other member for a direct room, resolved for the current caller.
        profilePhoto:
          type: string
          description: The other member's profile image for a direct room.
        peerKey:
          type: string
          description: Deterministic sorted pair of participant user IDs for one-to-one rooms.
        isArchived: { type: boolean }
        createdById: { type: string }
        createdByName: { type: string }
        createdAt: { type: string }
        unreadCount: { type: number }
        lastMessage:
          $ref: "#/components/schemas/ChatMessage"
      required: [id, shopId, kind, name, isArchived, createdAt]
    ChatRoomCreateInput:
      type: object
      description: >
        Create (or return existing) a one-to-one chat room. kind=customer
        requires customerId (must have exactly one active customer user link).
        kind=dealer requires dealerId (same shop) and resolves exactly one active
        dealer-portal target. kind=direct requires targetUserId and the matchToken
        returned by exact contact matching. support/group kinds are out of scope (400).
      properties:
        name: { type: string }
        kind: { type: string, enum: [customer, dealer, direct] }
        customerId: { type: string }
        dealerId: { type: string }
        targetUserId: { type: string }
        matchToken:
          type: string
          description: Required with kind=direct; obtained from /chat/contacts/match.
        clientRequestId: { type: string }
      required: [name, kind]
    ChatMessage:
      type: object
      properties:
        id: { type: string }
        roomId: { type: string }
        shopId: { type: string }
        senderId: { type: string }
        senderName: { type: string }
        kind: { type: string, enum: [text, image, file, audio, system] }
        body: { type: string }
        objectPath: { type: string }
        durationMs:
          type: number
          description: >
            Integer duration in milliseconds. Only set for kind=audio (voice notes).
        clientRequestId: { type: string }
        deletedAt: { type: string }
        createdAt: { type: string }
      required: [id, roomId, shopId, senderId, senderName, kind, body, createdAt]
    ChatMessageSendInput:
      type: object
      description: >
        Send a message. clientRequestId is REQUIRED and must be stable across
        retries; the server dedupes on (roomId, senderId, clientRequestId) and
        derives the Matrix transaction id deterministically so retries never
        create a second row nor a second provider event.
        For kind=audio a room-scoped objectPath and an integer durationMs
        (1..600000) are REQUIRED; durationMs must be omitted for non-audio kinds.
      properties:
        kind: { type: string, enum: [text, image, file, audio] }
        body: { type: string }
        objectPath: { type: string }
        durationMs:
          type: number
          minimum: 1
          maximum: 600000
          description: >
            Integer voice-note duration in milliseconds. REQUIRED for kind=audio;
            must be omitted for other kinds.
        clientRequestId: { type: string }
      required: [kind, body, clientRequestId]
    ChatMarkReadInput:
      type: object
      properties:
        messageId: { type: string }
      required: [messageId]
    ChatUploadUrlInput:
      type: object
      properties:
        name: { type: string }
        size: { type: number }
        contentType: { type: string }
      required: [name, size, contentType]
    ChatUploadUrlResult:
      type: object
      properties:
        uploadURL: { type: string }
        objectPath: { type: string }
      required: [uploadURL, objectPath]
    ChatCallTokenResult:
      type: object
      properties:
        token: { type: string }
