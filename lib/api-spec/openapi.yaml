    post:
      operationId: repairPaymentsVoidAll
      tags: [business]
      summary: Void every live payment of a repair in one transaction (dealer/owner only)
      description: >-
        Reverses all payments that are not already voided, so a repair that was
        settled by mistake goes back to unpaid. The repair row is locked for the
        whole operation, so a payment recorded concurrently cannot survive it.
        Rows are never deleted; each keeps its void audit trail and an offsetting
        finance entry.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RepairPaymentVoidInput" }
      responses:
        "200":
          description: The payments that were voided by this call
          content:
            application/json:
              schema:
                type: object
                properties:
                  # type: integer makes Orval emit z.int(), which is Zod 4-only
                  # while lib/api-zod is still on Zod 3.
                  voidedCount: { type: number }
                  paidAmount: { type: number }
                  payments:
                    type: array
                    items: { $ref: "#/components/schemas/RepairPayment" }
                required: [voidedCount, paidAmount, payments]
  /repairs/{id}/payments/{paymentId}/void:
    post:
      operationId: repairPaymentVoid
      tags: [business]
      summary: Void/reverse a payment (dealer/owner only, audit-preserving)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: paymentId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RepairPaymentVoidInput" }
      responses:
        "200":
          description: The voided payment row
          content:
            application/json:
              schema:
                type: object
                properties:
                  payment: { $ref: "#/components/schemas/RepairPayment" }
                required: [payment]
