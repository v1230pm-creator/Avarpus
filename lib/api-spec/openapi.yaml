      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReturnCreateInput"
      responses:
        "200":
          description: Created return case
          content:
            application/json:
              schema:
                type: object
                properties:
                  return: { $ref: "#/components/schemas/RepairReturn" }
                required: [return]
  /returns:
    get:
      operationId: returnsList
      tags: [business]
      summary: List the shop's return/rework cases
      responses:
        "200":
          description: Return cases, newest first
          content:
            application/json:
              schema:
                type: object
                properties:
                  returns:
                    type: array
                    items: { $ref: "#/components/schemas/RepairReturn" }
                required: [returns]
  /returns/{id}:
    get:
      operationId: returnsGet
      tags: [business]
      summary: Get a return case with its parts and refunds
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Return case detail
          content:
            application/json:
              schema:
                type: object
                properties:
                  return: { $ref: "#/components/schemas/RepairReturn" }
                  canSeeCosts: { type: boolean }
                  parts:
                    type: array
