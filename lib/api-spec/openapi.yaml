      responses:
        "200":
          description: Updated matrix
          content:
            application/json:
              schema:
                type: object
                properties:
                  matrix:
                    type: object
                    additionalProperties:
                      type: object
                      additionalProperties: { type: boolean }
                  permissions:
                    description: Canonical derived permissions for the caller; legacy matrix fields are unchanged.
