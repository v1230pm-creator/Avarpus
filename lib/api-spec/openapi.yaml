        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AppUpdateInput"
      responses:
        "201":
          description: Created draft release
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppUpdateEnvelope"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /app-updates/upload-url:
    post:
      operationId: appUpdateUploadUrl
      tags: [appUpdates]
      summary: Presigned APK upload URL (super_admin)
      responses:
        "200":
          description: Presigned PUT URL and object path
          content:
            application/json:
              schema:
                type: object
                properties:
                  uploadURL: { type: string }
                  objectPath: { type: string }
                required: [uploadURL, objectPath]
  /app-updates/{id}:
    patch:
      operationId: updateAppUpdate
      tags: [appUpdates]
      summary: Edit a release (super_admin)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AppUpdateInput"
      responses:
        "200":
          description: Updated release
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppUpdateEnvelope"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /app-updates/{id}/apk:
    get:
      operationId: downloadAppUpdateApk
      tags: [appUpdates]
      summary: Download the APK of a published release (binary, supports Range)
      description: >
        Authenticated binary download. Supports HTTP Range requests for
        pause/resume (206 partial content, 416 for invalid ranges). Only
        published releases are downloadable. Clients should download this via
        a native file downloader with the bearer token header, not the
        generated JSON client.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Full APK stream (application/vnd.android.package-archive)
        "206":
          description: Partial APK stream for a Range request
        "404":
          description: Unknown, unpublished, or APK-less release
        "416":
          description: Invalid Range header
  /app-updates/{id}/publish:
    post:
      operationId: publishAppUpdate
      tags: [appUpdates]
      summary: Publish a release (super_admin) — auto-archives the previously published release
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AppUpdatePublishInput"
      responses:
        "200":
          description: Published release
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppUpdateEnvelope"
        "409":
          description: Build number is lower than the currently published release (send allowLowerBuild to override for rollback)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "400":
          description: Release incomplete (no APK)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /app-updates/{id}/unpublish:
    post:
      operationId: unpublishAppUpdate
      tags: [appUpdates]
      summary: Unpublish a release (super_admin)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Unpublished release
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppUpdateEnvelope"
  /role-features:
    get:
      operationId: roleFeaturesGet
      tags: [business]
      summary: Effective feature toggles for the current user; owners also get the full per-role matrix
      responses:
        "200":
          description: Feature toggles
          content:
            application/json:
              schema:
                type: object
                properties:
                  features:
                    type: object
                    additionalProperties: { type: boolean }
                  matrix:
                    type: object
                    additionalProperties:
                      type: object
                      additionalProperties: { type: boolean }
                required: [features]
  /role-features/{role}:
    put:
      operationId: roleFeaturesUpdate
      tags: [business]
      summary: Update feature toggles for one role (shop owner only)
      parameters:
        - name: role
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RoleFeaturesInput"
      responses:
        "200":
          description: Updated matrix
          content:
            application/json:
              schema:
                type: object
                properties:
                  matrix:
                    type: object
                    additionalProperties:
                      type: object
                      additionalProperties: { type: boolean }
                required: [matrix]
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  # ── Customer activation invites ─────────────────────────────────────────────
  /customers/{id}/invite:
    post:
      operationId: customerInviteCreate
      tags: [business]
      summary: Issue a single-use activation invite for a customer (dealer/staff only)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Invite token (returned once, never stored in plaintext)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerInviteResult"

  /auth/activate-invite:
    post:
      operationId: authActivateInvite
      tags: [auth]
      summary: Activate a customer account using a single-use invite token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ActivateInviteInput"
      responses:
        "200":
          description: Account activated. Sign in separately with mobile OTP.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                  user:
                    $ref: "#/components/schemas/AuthUser"
                required: [message, user]

  # ── Chat capabilities ────────────────────────────────────────────────────────
  /chat/capabilities:
    get:
      operationId: chatCapabilities
      tags: [chat]
      summary: Describe available chat capabilities and provider status
      responses:
        "200":
          description: Capabilities
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatCapabilities"

  /chat/contacts/match:
    post:
      operationId: chatContactsMatch
      tags: [chat]
      summary: Match exact phone numbers to active users in the caller's shop
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChatContactMatchInput"
      responses:
        "200":
          description: Registered active exact matches only
          content:
            application/json:
              schema:
                type: object
                properties:
                  contacts:
                    type: array
                    items:
                      $ref: "#/components/schemas/ChatContact"
                required: [contacts]
        "429":
          description: Durable per-user or per-IP contact match limit exceeded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"

  # ── Chat rooms ───────────────────────────────────────────────────────────────
  /chat/rooms:
    get:
      operationId: chatRoomsList
      tags: [chat]
      summary: List chat rooms the caller belongs to (shop-scoped)
      responses:
        "200":
          description: Rooms
          content:
            application/json:
              schema:
                type: object
                properties:
                  rooms:
                    type: array
                    items:
                      $ref: "#/components/schemas/ChatRoom"
                required: [rooms]
    post:
      operationId: chatRoomsCreate
      tags: [chat]
      summary: Create or retrieve an idempotent one-to-one chat room
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChatRoomCreateInput"
      responses:
        "200":
          description: Room (created or existing)
          content:
            application/json:
              schema:
                type: object
                properties:
                  room:
                    $ref: "#/components/schemas/ChatRoom"
                  created: { type: boolean }
                required: [room, created]
        "400":
          description: Invalid kind (support/group out of scope) or missing fields
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
        "409":
          description: >
            Target account required or ambiguous. code is one of
            CUSTOMER_ACCOUNT_REQUIRED, DEALER_ACCOUNT_REQUIRED,
            DEALER_ACCOUNT_AMBIGUOUS.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceUnavailable"
        "503":
          description: Chat provider (Matrix/ESS) unavailable — no room created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceUnavailable"

  /chat/rooms/{roomId}:
    get:
      operationId: chatRoomsGet
      tags: [chat]
      summary: Get a single chat room (members only; unauthorized returns 404)
      parameters:
        - name: roomId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Room
          content:
            application/json:
              schema:
                type: object
                properties:
                  room:
                    $ref: "#/components/schemas/ChatRoom"
                required: [room]

  # ── Chat messages ────────────────────────────────────────────────────────────
  /chat/rooms/{roomId}/messages:
    get:
      operationId: chatMessagesList
      tags: [chat]
      summary: List messages in a room (newest-first, paginated)
      parameters:
        - name: roomId
          in: path
          required: true
          schema: { type: string }
        - { name: before, in: query, required: false, schema: { type: string }, description: "Cursor: createdAt of the oldest loaded message" }
        - { name: limit, in: query, required: false, schema: { type: number } }
      responses:
        "200":
          description: Messages
          content:
            application/json:
              schema:
                type: object
                properties:
                  messages:
                    type: array
                    items:
                      $ref: "#/components/schemas/ChatMessage"
                  hasMore: { type: boolean }
                required: [messages, hasMore]
    post:
      operationId: chatMessagesSend
      tags: [chat]
      summary: Send a message to a room (idempotent on clientRequestId)
      parameters:
        - name: roomId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChatMessageSendInput"
      responses:
        "200":
          description: Created or existing (idempotent) message
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    $ref: "#/components/schemas/ChatMessage"
                required: [message]
        "400":
          description: Missing/invalid fields (including clientRequestId)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
        "503":
          description: Chat provider unavailable — message not delivered or stored
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceUnavailable"

  # ── Read markers ─────────────────────────────────────────────────────────────
  /chat/rooms/{roomId}/read:
    post:
      operationId: chatMarkRead
      tags: [chat]
      summary: Update the caller's read marker for a room
      parameters:
        - name: roomId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChatMarkReadInput"
      responses:
        "200":
          description: Read marker updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"

  # ── Private chat upload URL ──────────────────────────────────────────────────
  /chat/rooms/{roomId}/upload-url:
    post:
      operationId: chatUploadUrl
      tags: [chat]
      summary: Request a presigned upload URL for a chat media attachment
      parameters:
        - name: roomId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChatUploadUrlInput"
      responses:
        "200":
          description: Upload URL and object path
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatUploadUrlResult"

  # ── Call tokens ──────────────────────────────────────────────────────────────
  /chat/rooms/{roomId}/call-token:
    post:
      operationId: chatCallToken
      tags: [chat]
      summary: Mint a short-lived LiveKit call token for the caller in this room
      parameters:
        - name: roomId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: LiveKit token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatCallTokenResult"
        "503":
          description: LiveKit credentials not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceUnavailable"

  # ── Chat media download ───────────────────────────────────────────────────────
  /chat/rooms/{roomId}/messages/{messageId}/media:
    get:
      operationId: chatMessageMedia
      tags: [chat]
      summary: >
        Download a chat media attachment. Requires room membership; verifies the
        message belongs to this room and has a non-null objectPath under the
        expected uploads/<shopId>/chat/<roomId>/ prefix. Streams the object
        directly from object storage. Returns 404 for any auth or path failure
        (no information leak).
      parameters:
        - name: roomId
          in: path
          required: true
          schema: { type: string }
        - name: messageId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Media file bytes
          content:
            "*/*":
              schema:
                type: string
                format: binary
        "404":
          description: Room or message not found, or caller not authorised

components:
  schemas:
    ProfileUpdateInput:
      type: object
      properties:
        name: { type: string }
        mobile: { type: string }
    NotificationsReadInput:
      type: object
      properties:
        ids:
          type: array
          items: { type: string }
    AppNotification:
      type: object
      properties:
        id: { type: string }
        type: { type: string }
        title: { type: string }
        body: { type: string }
        data: {}
        read: { type: boolean }
        createdAt: { type: string }
      required: [id, type, title, body, read, createdAt]
    RoleFeaturesInput:
      type: object
      properties:
        features:
          $ref: "#/components/schemas/FeatureMap"
      required: [features]
    FeatureMap:
      type: object
      additionalProperties: { type: boolean }
    IndividualFeatureChanges:
      type: object
      additionalProperties:
        type: [boolean, "null"]
    IndividualFeaturesInput:
      type: object
      properties:
        features:
          $ref: "#/components/schemas/IndividualFeatureChanges"
      required: [features]
    IndividualPermissions:
      type: object
      properties:
        user:
          $ref: "#/components/schemas/AuthUser"
        availableFeatures:
          type: array
          items: { type: string }
        roleFeatures:
          $ref: "#/components/schemas/FeatureMap"
        overrides:
          $ref: "#/components/schemas/FeatureMap"
        features:
          $ref: "#/components/schemas/FeatureMap"
      required: [user, availableFeatures, roleFeatures, overrides, features]
    AppUpdate:
      type: object
      properties:
        id: { type: string }
        version: { type: string }
        buildNumber: { type: number }
        releaseDate: { type: [string, "null"] }
        apkSize: { type: [number, "null"] }
        checksum: { type: [string, "null"] }
        updateType: { type: string }
        minAndroidVersion: { type: [string, "null"] }
        releaseNotes: {}
        screenshots: {}
        demoVideoUrl: { type: [string, "null"] }
        publishedAt: { type: [string, "null"] }
        apkUrl: { type: [string, "null"] }
      required: [id, version, buildNumber, updateType]
    AppUpdateAdmin:
      allOf:
        - $ref: "#/components/schemas/AppUpdate"
        - type: object
          properties:
            status: { type: string }
            downloadCount: { type: number }
            checkCount: { type: number }
            publishedByName: { type: [string, "null"] }
            createdAt: { type: string }
            apkPath: { type: [string, "null"] }
          required: [status, downloadCount, createdAt]
    AppUpdateInput:
      type: object
      properties:
        version: { type: string }
        buildNumber: { type: number }
        releaseDate: { type: [string, "null"] }
        apkPath: { type: [string, "null"] }
        updateType: { type: string, enum: [optional, recommended, critical] }
        minAndroidVersion: { type: [string, "null"] }
        releaseNotes: {}
        screenshots: {}
        demoVideoUrl: { type: [string, "null"] }
    AppUpdatePublishInput:
      type: object
      properties:
        allowLowerBuild: { type: boolean }
    AppUpdateStats:
      type: object
      properties:
        totalReleases: { type: number }
        publishedCount: { type: number }
        draftCount: { type: number }
        totalDownloads: { type: number }
        totalUpdateChecks: { type: number }
        currentVersion: { type: [string, "null"] }
        currentBuildNumber: { type: [number, "null"] }
        currentPublishedAt: { type: [string, "null"] }
        currentDownloadCount: { type: [number, "null"] }
      required:
        - totalReleases
        - publishedCount
        - draftCount
        - totalDownloads
        - totalUpdateChecks
    AppUpdateEnvelope:
      type: object
      properties:
        update:
          allOf:
            - $ref: "#/components/schemas/AppUpdate"
            - type: object
              properties:
                status: { type: string }
      required: [update]
    DashboardStats:
      type: object
      properties:
        todayRepairs: { type: number }
        pendingRepairs: { type: number }
        readyForPickup: { type: number }
        totalCustomers: { type: number }
        openApprovalRequests: { type: number }
        openReturnCases: { type: number }
        canSeeFinance: { type: boolean }
        todayIncome: { type: number }
        todayExpense: { type: number }
        todayRepairIncome: { type: number }
        todayProductIncome: { type: number }
        pendingPayments: { type: number }
        readyBalance: { type: number }
        refundsTotal: { type: number }
        refundsToday: { type: number }
      required:
        - todayRepairs
        - pendingRepairs
        - readyForPickup
        - totalCustomers
        - openApprovalRequests
        - openReturnCases
        - canSeeFinance
    Activity:
      type: object
      properties:
        id: { type: string }
        type: { type: string, enum: [repair, login] }
        action: { type: string }
        userId: { type: string, nullable: true }
        userName: { type: string }
        userRole: { type: string }
        repairId: { type: string, nullable: true }
        details: { type: object, nullable: true, additionalProperties: true }
        createdAt: { type: string }
      required: [id, type, action, userName, userRole, createdAt]
    OtpRequestInput:
      type: object
      properties:
        mobile: { type: string }
      required: [mobile]
    OtpVerifyInput:
      type: object
      properties:
        mobile: { type: string }
        code: { type: string }
        rememberMe: { type: boolean }
        deviceInfo: { type: string, maxLength: 120 }
        androidDeviceId:
          type: string
          pattern: "^[A-Fa-f0-9]{16}$"
          description: Android Settings.Secure ANDROID_ID. Never stored or returned; only its SHA-256 hash is retained.
      required: [mobile, code]
    TrustedDeviceRecoveryInput:
      type: object
      additionalProperties: false
      properties:
        androidDeviceId:
          type: string
          pattern: "^[A-Fa-f0-9]{16}$"
          description: Android Settings.Secure ANDROID_ID. MAC addresses, IMEIs, serials, and SIM identifiers are not accepted.
      required: [androidDeviceId]
    OtpProviderStatus:
      type: object
      properties:
        provider: { type: string, enum: [Hanu OTP] }
        configured: { type: boolean }
        endpoint: { type: string }
        templateId: { type: string, description: "Hanu template ID; default selects Hanu's built-in no-DLT OTP template." }
        apiKeyConfigured: { type: boolean }
      required: [provider, configured, endpoint, templateId, apiKeyConfigured]
    RegisterStartInput:
      type: object
      properties:
        name: { type: string }
        businessName: { type: string }
        email: { type: string }
        mobile: { type: string }
        gstNumber: { type: string }
        shopAddress: { type: string }
      required: [name, businessName, email, mobile, shopAddress]
    RegisterVerifyInput:
      type: object
      properties:
        email: { type: string }
        code: { type: string }
      required: [email, code]
    LoginEvent:
      type: object
      properties:
        id: { type: string }
        method: { type: string }
        rememberMe: { type: boolean }
        deviceInfo: { type: string }
        createdAt: { type: string }
      required: [id, method, rememberMe, createdAt]
    SessionInfo:
      type: object
      properties:
        id: { type: string }
        deviceInfo: { type: string }
        createdAt: { type: string }
        expiresAt: { type: string }
        current: { type: boolean }
      required: [id, createdAt, expiresAt, current]
    Message:
      type: object
      properties:
        message: { type: string }
      required: [message]
    AuthUser:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        email: { type: string }
        mobile: { type: string }
        role: { type: string }
        isActive: { type: boolean }
        designation: { type: string }
        joinDate: { type: string }
        businessName: { type: string }
        gstNumber: { type: string }
        shopAddress: { type: string }
        profilePhoto: { type: string }
        companyLogo: { type: string }
        shopId: { type: string }
        dealerId: { type: string }
      required: [id, name, email, mobile, role, isActive]
    StaffCreateInput:
      type: object
      properties:
        name: { type: string }
        email: { type: string }
        mobile: { type: string }
        role: { type: string, enum: [reception, technician, store_manager, accountant, dealer_owner, dealer_staff] }
        designation: { type: string }
        dealerId: { type: string }
      required: [name, email, mobile, role]
    StaffUpdateInput:
      type: object
      properties:
        name: { type: string }
        mobile: { type: string }
        role: { type: string, enum: [reception, technician, store_manager, accountant, dealer_owner, dealer_staff] }
        designation: { type: string }
    RegisterVerifyResult:
      type: object
      properties:
        user:
          $ref: "#/components/schemas/AuthUser"
        message: { type: string }
      required: [user, message]
    AuthSession:
      type: object
      properties:
        token: { type: string }
        user:
          $ref: "#/components/schemas/AuthUser"
      required: [token, user]
    Dealer:
      type: object
      properties:
        id: { type: string }
        dealerCode: { type: string }
        name: { type: string }
        shopName: { type: string }
        mobile: { type: string }
        location: { type: string }
        isActive: { type: boolean }
        createdById: { type: string }
        createdByName: { type: string }
        createdAt: { type: string }
      required: [id, dealerCode, name, mobile, isActive, createdAt]
    DealerWithCounts:
      allOf:
        - $ref: "#/components/schemas/Dealer"
        - type: object
          properties:
            totalRepairs: { type: number }
            received: { type: number }
            repairing: { type: number }
            ready: { type: number }
            delivered: { type: number }
          required: [totalRepairs, received, repairing, ready, delivered]
    DealerInput:
      type: object
      properties:
        name: { type: string }
        shopName: { type: string }
        mobile: { type: string }
        location: { type: string }
        isActive: { type: boolean }
    DealerStats:
      type: object
      properties:
        totalRepairs: { type: number }
        received: { type: number }
        repairing: { type: number }
        ready: { type: number }
        delivered: { type: number }
        cancelled: { type: number }
        afterSaleReturns: { type: number }
        refunded: { type: number }
        refundedAmount: { type: number }
        totalRepairValue: { type: number }
        pendingAmount: { type: number }
      required: [totalRepairs, received, repairing, ready, delivered, cancelled, afterSaleReturns, refunded, refundedAmount, totalRepairValue, pendingAmount]
    DealerProfile:
      type: object
      properties:
        dealer:
          $ref: "#/components/schemas/Dealer"
        stats:
          $ref: "#/components/schemas/DealerStats"
      required: [dealer, stats]
    DealerOverviewStats:
      type: object
      properties:
        totalDealerRepairs: { type: number }
        activeRepairs: { type: number }
