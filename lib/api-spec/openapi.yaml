openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Authentication operations
paths:
  /auth/login:
    post:
      operationId: authLogin
      tags: [auth]
      summary: Sign in with email/mobile and password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSession"
  /auth/otp/request:
    post:
      operationId: authOtpRequest
      tags: [auth]
      summary: Request a login OTP for a mobile number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OtpRequestInput"
      responses:
        "200":
          description: OTP request accepted
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                required: [message]
  /auth/otp/verify:
    post:
      operationId: authOtpVerify
      tags: [auth]
      summary: Verify a login OTP and sign in
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OtpVerifyInput"
      responses:
        "200":
          description: Signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSession"
  /auth/register/start:
    post:
      operationId: authRegisterStart
      tags: [auth]
      summary: Start registration and send email OTP
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterStartInput"
      responses:
        "200":
          description: OTP sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
  /auth/register/verify:
    post:
      operationId: authRegisterVerify
      tags: [auth]
      summary: Verify email OTP and create the account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterVerifyInput"
      responses:
        "200":
          description: Account created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
  /auth/forgot/request:
    post:
      operationId: authForgotRequest
      tags: [auth]
      summary: Request a password reset OTP
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ForgotRequestInput"
      responses:
        "200":
          description: Request accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
  /auth/forgot/verify:
    post:
      operationId: authForgotVerify
      tags: [auth]
      summary: Verify a password reset OTP
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterVerifyInput"
      responses:
        "200":
          description: Verified
          content:
            application/json:
              schema:
                type: object
                properties:
                  resetToken: { type: string }
                required: [resetToken]
  /auth/forgot/reset:
    post:
      operationId: authForgotReset
      tags: [auth]
      summary: Reset password with a reset token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ForgotResetInput"
      responses:
        "200":
          description: Password updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
  /auth/me:
    get:
      operationId: authMe
      tags: [auth]
      summary: Get the current authenticated user
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    $ref: "#/components/schemas/AuthUser"
                required: [user]
  /auth/login-history:
    get:
      operationId: authLoginHistory
      tags: [auth]
      summary: List recent successful logins for the current user
      responses:
        "200":
          description: Login history
          content:
            application/json:
              schema:
                type: object
                properties:
                  events:
                    type: array
                    items:
                      $ref: "#/components/schemas/LoginEvent"
                required: [events]
  /auth/sessions:
    get:
      operationId: authSessions
      tags: [auth]
      summary: List active sessions for the current user
      responses:
        "200":
          description: Active sessions
          content:
            application/json:
              schema:
                type: object
                properties:
                  sessions:
                    type: array
                    items:
                      $ref: "#/components/schemas/SessionInfo"
                required: [sessions]
  /auth/sessions/{id}:
    delete:
      operationId: authRevokeSession
      tags: [auth]
      summary: Sign out a specific session by id
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Session revoked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
  /auth/sessions/revoke-others:
    post:
      operationId: authRevokeOtherSessions
      tags: [auth]
      summary: Sign out all sessions except the current one
      responses:
        "200":
          description: Other sessions revoked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
  /auth/logout:
    post:
      operationId: authLogout
      tags: [auth]
      summary: Sign out and invalidate the session
      responses:
        "200":
          description: Signed out
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
components:
  schemas:
    LoginInput:
      type: object
      properties:
        emailOrMobile: { type: string }
        password: { type: string }
        rememberMe: { type: boolean }
        device: { type: string }
      required: [emailOrMobile, password]
    ForgotRequestInput:
      type: object
      properties:
        email: { type: string }
      required: [email]
    ForgotResetInput:
      type: object
      properties:
        email: { type: string }
        resetToken: { type: string }
        newPassword: { type: string }
      required: [email, resetToken, newPassword]
    OtpRequestInput:
      type: object
      properties:
        mobile: { type: string }
      required: [mobile]
    OtpVerifyInput:
      type: object
      properties:
        mobile: { type: string }
        code: { type: string }
        rememberMe: { type: boolean }
        device: { type: string }
      required: [mobile, code]
    RegisterStartInput:
      type: object
      properties:
        name: { type: string }
        businessName: { type: string }
        email: { type: string }
        mobile: { type: string }
        password: { type: string }
        gstNumber: { type: string }
        shopAddress: { type: string }
      required: [name, businessName, email, mobile, password, shopAddress]
    RegisterVerifyInput:
      type: object
      properties:
        email: { type: string }
        code: { type: string }
      required: [email, code]
    LoginEvent:
      type: object
      properties:
        id: { type: string }
        method: { type: string }
        rememberMe: { type: boolean }
        deviceInfo: { type: string }
        createdAt: { type: string }
      required: [id, method, rememberMe, createdAt]
    SessionInfo:
      type: object
      properties:
        id: { type: string }
        deviceInfo: { type: string }
        createdAt: { type: string }
        expiresAt: { type: string }
        current: { type: boolean }
      required: [id, createdAt, expiresAt, current]
    Message:
      type: object
      properties:
        message: { type: string }
      required: [message]
    AuthUser:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        email: { type: string }
        mobile: { type: string }
        role: { type: string }
        isActive: { type: boolean }
        designation: { type: string }
        joinDate: { type: string }
        businessName: { type: string }
        gstNumber: { type: string }
        shopAddress: { type: string }
        profilePhoto: { type: string }
        companyLogo: { type: string }
      required: [id, name, email, mobile, role, isActive]
    AuthSession:
      type: object
      properties:
        token: { type: string }
        user:
          $ref: "#/components/schemas/AuthUser"
      required: [token, user]
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

