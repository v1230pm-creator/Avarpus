openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Authentication operations
  - name: shop
    description: Business workspace setup, membership, switching, and recovery
  - name: business
    description: Shop-scoped business data (repairs, customers, inventory, purchases, finance)
  - name: Storage
    description: Object storage upload and serving endpoints.
  - name: dashboard
    description: Read-only dashboard stats and activity feed.
  - name: chat
    description: Real-time chat rooms, messages, read receipts and call tokens.
paths:
  /public/requests:
    post:
      operationId: publicRequestCreate
      tags: [public]
      summary: Record a public support or account-deletion request
      description: >
        Records a request for staff review. A successful response confirms only
        that the request was received; it never confirms account deletion.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PublicRequestInput"
      responses:
        "202":
          description: Request recorded for review
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicRequestReceipt"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
        "429":
          description: Too many requests
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
  /public/requests/admin:
    get:
      operationId: publicRequestAdminList
      tags: [public]
      security:
        - bearerAuth: []
      summary: List public requests for super administrators
      parameters:
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 100 } }
        - { name: cursor, in: query, required: false, schema: { type: string } }
        - { name: status, in: query, required: false, schema: { type: string, enum: [received, in_review, resolved, rejected] } }
        - { name: kind, in: query, required: false, schema: { type: string, enum: [support, account_deletion] } }
        - { name: search, in: query, required: false, schema: { type: string, maxLength: 100 } }
      responses:
        "200":
          description: Public request queue
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicRequestList"
        "401": { description: Authentication required }
        "403": { description: Super administrator required }
  /public/requests/admin/{id}:
    get:
      operationId: publicRequestAdminGet
      tags: [public]
      security:
        - bearerAuth: []
      summary: Get a public request and its review history
      parameters:
        - $ref: "#/components/parameters/PublicRequestId"
      responses:
        "200":
          description: Public request detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicRequestDetail"
        "401": { description: Authentication required }
        "403": { description: Super administrator required }
        "404": { description: Request not found }
  /public/requests/admin/{id}/status:
    patch:
      operationId: publicRequestAdminStatusUpdate
      tags: [public]
      security:
        - bearerAuth: []
      summary: Advance a public request through the review workflow
      parameters:
        - $ref: "#/components/parameters/PublicRequestId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PublicRequestStatusUpdate"
      responses:
        "200":
          description: Updated public request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicRequestDetail"
        "400": { description: Invalid status update }
        "401": { description: Authentication required }
        "403": { description: Super administrator required }
        "404": { description: Request not found }
        "409": { description: Illegal state transition }
  /public/requests/admin/{id}/identity-verification:
    post:
      operationId: publicRequestAdminIdentityVerificationCreate
      tags: [public]
      security:
        - bearerAuth: []
      summary: Record identity verification for an account deletion request
      parameters:
        - $ref: "#/components/parameters/PublicRequestId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PublicRequestIdentityVerificationInput"
      responses:
        "200":
          description: Identity verification recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicRequestDetail"
        "400": { description: Invalid identity verification }
        "401": { description: Authentication required }
        "403": { description: Super administrator required }
        "404": { description: Request not found }
        "409": { description: Verification is not permitted }
  /public/contact:
    get:
      operationId: publicContactGet
      tags: [public]
      summary: Public contact details shown on the Avarpus website
      description: >
        Unauthenticated read of the operator contact details that are meant to
        be published. Only fields an operator has explicitly configured are
        returned; nothing here is derived from requester data.
      responses:
        "200":
          description: Published contact details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicContact"
  /settings/support-notifications:
    get:
      operationId: supportNotificationSettingsGet
      tags: [public]
      security:
        - bearerAuth: []
      summary: Read the inbox that new public request alerts are emailed to
      responses:
        "200":
          description: Current support notification settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SupportNotificationSettings"
        "401": { description: Authentication required }
        "403": { description: Super administrator required }
    put:
      operationId: supportNotificationSettingsUpdate
      tags: [public]
      security:
        - bearerAuth: []
      summary: Set or clear the inbox that new public request alerts are emailed to
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SupportNotificationSettingsInput"
      responses:
        "200":
          description: Updated support notification settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SupportNotificationSettings"
        "400": { description: Invalid email address }
        "401": { description: Authentication required }
        "403": { description: Super administrator required }
  /auth/otp/request:
    post:
      operationId: authOtpRequest
      tags: [auth]
      summary: Request an OTP for a mobile number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OtpRequestInput"
      responses:
        "200":
          description: OTP request accepted
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                required: [message]
  /auth/otp/resend:
    post:
      operationId: authOtpResend
      tags: [auth]
      summary: Resend an OTP for a mobile number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OtpRequestInput"
      responses:
        "200":
          description: OTP resend request accepted
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                required: [message]
  /auth/otp/verify:
    post:
      operationId: authOtpVerify
      tags: [auth]
      summary: Verify a login OTP and sign in
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OtpVerifyInput"
      responses:
        "200":
          description: Signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSession"
  /auth/trusted-device/recover:
    post:
      operationId: authTrustedDeviceRecover
      tags: [auth]
      summary: Recover an Android trusted-device session without extending trust
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TrustedDeviceRecoveryInput"
      responses:
        "200":
          description: Recovered session, bounded by the original recovery deadline
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSession"
  /auth/otp/provider-status:
    get:
      operationId: authOtpProviderStatus
      tags: [auth]
      summary: Get the configured OTP provider status (super_admin only)
      responses:
        "200":
          description: Hanu OTP provider status without credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OtpProviderStatus"
  /auth/register/start:
    post:
      operationId: authRegisterStart
      tags: [auth]
      summary: Start registration and send email OTP
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterStartInput"
      responses:
        "200":
          description: OTP sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
  /auth/register/verify:
    post:
      operationId: authRegisterVerify
      tags: [auth]
      summary: Verify email OTP and create the account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterVerifyInput"
      responses:
        "200":
          description: >
            Dealer account created after email verification. Sign in is always
            completed separately with the registered mobile OTP.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegisterVerifyResult"
  /auth/me:
    get:
      operationId: authMe
      tags: [auth]
      summary: Get the current authenticated user
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    $ref: "#/components/schemas/AuthUser"
                required: [user]
    patch:
      operationId: authMeUpdate
      tags: [auth]
      summary: Update own profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProfileUpdateInput"
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    $ref: "#/components/schemas/AuthUser"
                required: [user]
  # ── Business workspace management ───────────────────────────────────────────
  /shop/me:
    get:
      operationId: shopWorkspaceGet
      tags: [shop]
      security:
        - bearerAuth: []
      summary: Get the current user's active workspace and memberships
      responses:
        "200":
          description: Active business workspace and all active memberships
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShopMeResponse"
  /shop/setup/request:
    post:
      operationId: shopSetupRequestCreate
      tags: [shop]
      security:
        - bearerAuth: []
      summary: Start business workspace setup and send a verification code
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ShopSetupRequestInput"
      responses:
        "200":
          description: Verification code sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShopSetupRequestResult"
  /shop/setup/verify:
    post:
      operationId: shopSetupVerificationCreate
      tags: [shop]
      security:
        - bearerAuth: []
      summary: Verify the business email and create a workspace
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ShopSetupVerifyInput"
      responses:
        "200":
          description: Business workspace created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShopUserResult"
  /shop/invitations:
    post:
      operationId: shopInvitationCreate
      tags: [shop]
      security:
        - bearerAuth: []
      summary: Create or renew a staff invitation for the current workspace owner
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ShopInvitationInput"
      responses:
        "200":
          description: Staff invitation created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShopInvitationResult"
  /shop/claim:
    post:
      operationId: shopInvitationClaim
      tags: [shop]
      security:
        - bearerAuth: []
      summary: Claim a pending staff invitation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ShopClaimInput"
      responses:
        "200":
          description: Staff member joined the workspace
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShopUserResult"
  /shop/switch:
    post:
      operationId: shopWorkspaceSwitch
      tags: [shop]
      security:
        - bearerAuth: []
      summary: Switch the active business workspace
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ShopSwitchInput"
      responses:
        "200":
          description: Active workspace changed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShopSwitchResult"
  /shop/recovery/request:
    post:
      operationId: shopRecoveryCodeRequest
      tags: [shop]
      security:
        - bearerAuth: []
      summary: Request a recovery code for an active workspace membership
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ShopRecoveryRequestInput"
      responses:
        "200":
          description: Recovery code sent to the workspace's verified business email
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShopRecoveryRequestResult"
  /shop/recovery/verify:
    post:
      operationId: shopRecoveryVerificationCreate
      tags: [shop]
      security:
        - bearerAuth: []
      summary: Verify a workspace recovery code and restore the active workspace
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ShopRecoveryVerifyInput"
      responses:
        "200":
          description: Business workspace restored
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShopUserResult"
  /notifications:
    get:
      operationId: notificationsList
      tags: [business]
      summary: Latest in-app notifications for the current user
      responses:
        "200":
          description: Notifications
          content:
            application/json:
              schema:
                type: object
                properties:
                  unreadCount: { type: number }
                  notifications:
                    type: array
                    items:
                      $ref: "#/components/schemas/AppNotification"
                required: [unreadCount, notifications]
  /notifications/read:
    post:
      operationId: notificationsMarkRead
      tags: [business]
      summary: Mark notifications read (all when ids omitted)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NotificationsReadInput"
      responses:
        "200":
          description: Marked read
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                required: [message]
  /push/tokens:
    post:
      operationId: pushTokenRegister
      tags: [business]
      summary: Register this device's push token against the signed-in session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PushTokenInput"
      responses:
        "200":
          description: Device registered for push
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                required: [message]
        "400": { description: Invalid push token or platform }
        "401": { description: Authentication required }
  /push/tokens/unregister:
    post:
      operationId: pushTokenUnregister
      tags: [business]
      summary: Stop push delivery to this device (idempotent)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PushTokenUnregisterInput"
      responses:
        "200":
          description: Push disabled for this device
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                required: [message]
        "401": { description: Authentication required }
  /staff:
    get:
      operationId: staffList
      tags: [auth]
      summary: List staff of the current dealer's shop (dealer/super_admin only)
      responses:
        "200":
          description: Staff members
          content:
            application/json:
              schema:
                type: object
                properties:
                  staff:
                    type: array
                    items:
                      $ref: "#/components/schemas/StaffListItem"
                required: [staff]
    post:
      operationId: staffCreate
      tags: [auth]
      summary: Create a staff account in the current dealer's shop (dealer/super_admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StaffCreateInput"
      responses:
        "200":
          description: Staff account created
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    $ref: "#/components/schemas/AuthUser"
                required: [user]
  /staff/{id}/activate:
    patch:
      operationId: staffActivate
      tags: [auth]
      summary: Approve a pending staff account (dealer/super_admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Activated account
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    $ref: "#/components/schemas/AuthUser"
                required: [user]
  /staff/{id}/permissions:
    get:
      operationId: staffPermissionsGet
      tags: [auth]
      summary: Get role defaults, individual overrides, and effective permissions for one managed account
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Individual permission settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IndividualPermissions"
    put:
      operationId: staffPermissionsUpdate
      tags: [auth]
      summary: Set or clear individual permission overrides for one managed account
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IndividualFeaturesInput"
      responses:
        "200":
          description: Updated individual permission settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IndividualPermissions"
  /staff/{id}:
    patch:
      operationId: staffUpdate
      tags: [auth]
      summary: Update a staff member's profile (dealer/super_admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StaffUpdateInput"
      responses:
        "200":
          description: Updated account
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    $ref: "#/components/schemas/AuthUser"
                required: [user]
    delete:
      operationId: staffReject
      tags: [auth]
      summary: Reject and remove a pending staff account (dealer/super_admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Account removed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
  /auth/login-history:
    get:
      operationId: authLoginHistory
      tags: [auth]
      summary: List recent successful logins for the current user
      responses:
        "200":
          description: Login history
          content:
            application/json:
              schema:
                type: object
                properties:
                  events:
                    type: array
                    items:
                      $ref: "#/components/schemas/LoginEvent"
                required: [events]
  /auth/sessions:
    get:
      operationId: authSessions
      tags: [auth]
      summary: List active sessions for the current user
      responses:
        "200":
          description: Active sessions
          content:
            application/json:
              schema:
                type: object
                properties:
                  sessions:
                    type: array
                    items:
                      $ref: "#/components/schemas/SessionInfo"
                required: [sessions]
  /auth/sessions/{id}:
    delete:
      operationId: authRevokeSession
      tags: [auth]
      summary: Sign out a specific session by id
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Session revoked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
  /auth/sessions/revoke-others:
    post:
      operationId: authRevokeOtherSessions
      tags: [auth]
      summary: Sign out all sessions except the current one
      responses:
        "200":
          description: Other sessions revoked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
  /auth/logout:
    post:
      operationId: authLogout
      tags: [auth]
      summary: Sign out, invalidate the session, and revoke its trusted-device recovery when present
      responses:
        "200":
          description: Signed out
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
  /dealers:
    get:
      operationId: dealersList
      tags: [business]
      summary: List B2B dealers of the caller's shop with live repair counts
      parameters:
        - { name: q, in: query, required: false, schema: { type: string } }
      responses:
        "200":
          description: Dealers
          content:
            application/json:
              schema:
                type: object
                properties:
                  dealers:
                    type: array
                    items:
                      $ref: "#/components/schemas/DealerWithCounts"
                required: [dealers]
    post:
      operationId: dealersCreate
      tags: [business]
      summary: Create a B2B dealer in the caller's shop
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DealerInput"
      responses:
        "200":
          description: Created dealer
          content:
            application/json:
              schema:
                type: object
                properties:
                  dealer:
                    $ref: "#/components/schemas/Dealer"
                required: [dealer]
  /dealers/detect:
    get:
      operationId: dealersDetect
      tags: [business]
      summary: Detect active dealers whose registered mobile exactly matches
      parameters:
        - { name: mobile, in: query, required: true, schema: { type: string } }
      responses:
        "200":
          description: Matching active dealers (empty when none)
          content:
            application/json:
              schema:
                type: object
                properties:
                  dealers:
                    type: array
                    items:
                      $ref: "#/components/schemas/Dealer"
                required: [dealers]
  /dealers/me:
    get:
      operationId: dealersMe
      tags: [business]
      summary: Dealer-portal account's own dealer profile + stats
      description: >-
        Stats also count repairs booked under the login's own walk-in customer
        rows in this shop (same mobile), matching what GET /repairs lists for
        the same login. `supplier` describes the repair shop from the portal
        login's side: the business that repairs the phones they send in, with
        the shop owner's name and mobile.
      responses:
        "200":
          description: Own dealer profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DealerPortalProfile"
  /dealers/suppliers:
    get:
      operationId: dealersSuppliersList
      tags: [business]
      summary: Shops where the caller is filed as a B2B dealer (matched by verified mobile)
      description: >-
        For business accounts only (not dealer-portal or customer logins).
        Lists every OTHER shop holding an active dealer record with the
        caller's mobile, with that shop's contact and the caller's live repair
        stats there. Shops that switched their dealer portal off are omitted.
      responses:
        "200":
          description: Supplier links
          content:
            application/json:
              schema:
                type: object
                properties:
                  suppliers:
                    type: array
                    items:
                      $ref: "#/components/schemas/SupplierLink"
                required: [suppliers]
  /dealers/suppliers/{dealerId}/repairs:
    get:
      operationId: dealersSuppliersRepairsList
      tags: [business]
      summary: Repairs the supplier shop booked against the caller's dealer record
      description: >-
        Read-only portal projection, newest first. 404 when the dealer record
        is not the caller's, is inactive, or the shop disabled its portal.
      parameters:
        - name: dealerId
          in: path
          required: true
          schema: { type: string }
        - { name: q, in: query, required: false, schema: { type: string } }
        - { name: status, in: query, required: false, schema: { type: string } }
        - { name: page, in: query, required: false, schema: { type: number } }
        - { name: limit, in: query, required: false, schema: { type: number } }
      responses:
        "200":
          description: Repairs
          content:
            application/json:
              schema:
                type: object
                properties:
                  repairs:
                    type: array
                    items:
                      $ref: "#/components/schemas/Repair"
                  total: { type: number }
                  page: { type: number }
                  limit: { type: number }
                required: [repairs, total, page, limit]
        "404":
          description: Not the caller's dealer record
  /dealers/overview:
    get:
      operationId: dealersOverview
      tags: [business]
      summary: Overall dealer-repair statistics (dealer/owner only)
      responses:
        "200":
          description: Overview stats
          content:
            application/json:
              schema:
                type: object
                properties:
                  stats:
                    $ref: "#/components/schemas/DealerOverviewStats"
                required: [stats]
  /dealers/{id}:
    get:
      operationId: dealersGet
      tags: [business]
      summary: Dealer profile + full stats
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Dealer profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DealerProfile"
    patch:
      operationId: dealersUpdate
      tags: [business]
      summary: Update a dealer (dealer/owner only)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DealerInput"
      responses:
        "200":
          description: Updated dealer
          content:
            application/json:
              schema:
                type: object
                properties:
                  dealer:
                    $ref: "#/components/schemas/Dealer"
                required: [dealer]
  /dealers/lookup:
    get:
      operationId: dealersLookup
      tags: [business]
      summary: Look up another shop's owner by their registered mobile number
      description: >-
        Used when composing a dealer-to-dealer transaction: resolves a
        mobile number to the OTHER shop's identity (never the caller's own
        shop, never a dealer-portal login). Returns match: null when no
        active shop owner is registered with that mobile. The response only
        ever carries ids/names — never further account details.
      parameters:
        - { name: mobile, in: query, required: true, schema: { type: string } }
      responses:
        "200":
          description: Lookup result
          content:
            application/json:
              schema:
                type: object
                properties:
                  match:
                    nullable: true
                    $ref: "#/components/schemas/DealerLookupMatch"
                required: [match]
  /dealers/transactions:
    get:
      operationId: dealerTransactionsList
      tags: [business]
      summary: List dealer-to-dealer transactions involving the caller's shop
      description: >-
        direction=incoming lists repairs in the caller's OWN shop that were
        sent in by another dealer shop. direction=outgoing lists repairs
        physically held in ANOTHER shop that the caller's shop sent there —
        a deliberate cross-shop read scoped strictly to rows the caller's
        shop is recorded as the sender of.
      parameters:
        - name: direction
          in: query
          required: true
          schema: { type: string, enum: [incoming, outgoing] }
        - { name: status, in: query, required: false, schema: { type: string } }
        - { name: page, in: query, required: false, schema: { type: number } }
        - { name: limit, in: query, required: false, schema: { type: number } }
      responses:
        "200":
          description: Transactions
          content:
            application/json:
              schema:
                type: object
                properties:
                  repairs:
                    type: array
                    items:
                      $ref: "#/components/schemas/Repair"
                  total: { type: number }
                  page: { type: number }
                  limit: { type: number }
                required: [repairs, total, page, limit]
  /dealers/directory:
    get:
      operationId: dealersDirectory
      tags: [business]
      summary: Search verified shop owners to send a device to
      description: >-
        Returns OTHER registered shops (verified owner accounts only, never
        dealer-portal or customer logins, never the caller's own shop).
        Matches business name, owner name or Dealer ID by prefix/substring;
        a full Indian mobile number (10 digits, optionally with +91/0 prefix,
        spaces or dashes) matches the owner's registered mobile exactly —
        partial numbers never match. Shops owned by a `dealer` or the
        platform `super_admin` both count as verified. Results only carry
        ids and names — the owner's mobile is never returned here.
      parameters:
        - { name: q, in: query, required: true, schema: { type: string, minLength: 1, maxLength: 80 } }
      responses:
        "200":
          description: Matching shops (empty when none)
          content:
            application/json:
              schema:
                type: object
                properties:
                  dealers:
                    type: array
                    items:
                      $ref: "#/components/schemas/DealerDirectoryEntry"
                required: [dealers]
  /repairs/{id}/transfer:
    post:
      operationId: repairsTransfer
      tags: [business]
      summary: Offer an existing repair to another registered shop (Send to Dealer)
      description: >-
        Creates a PENDING dealer transfer request for a repair the caller's
        shop holds. Nothing is created in the receiving shop until they
        accept. Rejected (409 TRANSFER_PENDING) while another request for the
        same repair is still waiting, and (409 TRANSFER_ACTIVE) while an
        accepted transfer is still being repaired by the other shop.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DealerTransferInput"
      responses:
        "200":
          description: Request created
          content:
            application/json:
              schema:
                type: object
                properties:
                  request:
                    $ref: "#/components/schemas/DealerTransferRequest"
                required: [request]
        "404":
          description: Repair not found in the caller's shop / unknown receiving shop
        "409":
          description: A transfer for this repair is already pending or active
  /dealers/transfers:
    get:
      operationId: dealerTransfersList
      tags: [business]
      summary: List dealer transfer requests involving the caller's shop
      description: >-
        direction=incoming lists requests other shops sent TO the caller's
        shop; direction=outgoing lists requests the caller's shop sent.
        Newest first. Optional status filter (pending|accepted|declined|cancelled).
      parameters:
        - name: direction
          in: query
          required: true
          schema: { type: string, enum: [incoming, outgoing] }
        - { name: status, in: query, required: false, schema: { type: string, enum: [pending, accepted, declined, cancelled] } }
        - { name: page, in: query, required: false, schema: { type: number } }
        - { name: limit, in: query, required: false, schema: { type: number } }
      responses:
        "200":
          description: Requests
          content:
            application/json:
              schema:
                type: object
                properties:
                  requests:
                    type: array
                    items:
                      $ref: "#/components/schemas/DealerTransferRequest"
                  total: { type: number }
                  page: { type: number }
                  limit: { type: number }
                required: [requests, total, page, limit]
  /dealers/transfers/{id}:
    get:
      operationId: dealerTransfersGet
      tags: [business]
      summary: Dealer transfer request detail, from either side
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Request detail
          content:
            application/json:
              schema:
                type: object
                properties:
                  request:
                    $ref: "#/components/schemas/DealerTransferRequest"
                required: [request]
        "404":
          description: Not found or not a party to this request
  /dealers/transfers/{id}/accept:
    post:
      operationId: dealerTransfersAccept
      tags: [business]
      summary: Receiving shop accepts the device
      description: >-
        Only the receiving shop may call this, and only while the request is
        pending. Creates the receiving shop's repair row in one transaction,
        importing every saved (non-empty) device fact from the sender's
        record, and marks the device as received. Idempotent for a request
        this shop already accepted.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Accepted
          content:
            application/json:
              schema:
                type: object
                properties:
                  request:
                    $ref: "#/components/schemas/DealerTransferRequest"
                  repair:
                    $ref: "#/components/schemas/Repair"
                required: [request, repair]
        "409":
          description: Request is no longer pending (declined / cancelled)
  /dealers/transfers/{id}/decline:
    post:
      operationId: dealerTransfersDecline
      tags: [business]
      summary: Receiving shop declines the device
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DealerTransferDeclineInput"
      responses:
        "200":
          description: Declined
          content:
            application/json:
              schema:
                type: object
                properties:
                  request:
                    $ref: "#/components/schemas/DealerTransferRequest"
                required: [request]
        "409":
          description: Request is no longer pending
  /dealers/transfers/{id}/cancel:
    post:
      operationId: dealerTransfersCancel
      tags: [business]
      summary: Sending shop withdraws a pending request
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Cancelled
          content:
            application/json:
              schema:
                type: object
                properties:
                  request:
                    $ref: "#/components/schemas/DealerTransferRequest"
                required: [request]
        "409":
          description: Request is no longer pending (already accepted / declined)
  /dealers/transactions/ledger:
    get:
      operationId: dealerTransactionsLedger
      tags: [business]
      summary: Dealer-to-dealer ledger summary for the caller's shop
      description: >-
        One row per (other shop, direction). direction=payable rows are the
        shops repairing devices the caller sent (Khata → Suppliers);
        direction=receivable rows are shops whose devices the caller repairs.
        Every figure is derived on read from the shared repair, payment and
        refund rows, so both shops always see the same balance. Requires the
        payments feature.
      responses:
        "200":
          description: Ledger parties
          content:
            application/json:
              schema:
                type: object
                properties:
                  parties:
                    type: array
                    items:
                      $ref: "#/components/schemas/DealerLedgerParty"
                  totals:
                    type: object
                    properties:
                      receivable: { type: number }
                      payable: { type: number }
                    required: [receivable, payable]
                required: [parties, totals]
  /dealers/transactions/ledger/{shopId}:
    get:
      operationId: dealerTransactionsLedgerGet
      tags: [business]
      summary: Full dealer ledger with ONE other shop in ONE direction
      description: >-
        Chronological bill / payment / void / refund entries with a running
        balance, from the caller's point of view. The two directions between
        the same pair of shops are independent ledgers and are never netted.
      parameters:
        - name: shopId
          in: path
          required: true
          schema: { type: string }
        - name: direction
          in: query
          required: true
          schema: { type: string, enum: [receivable, payable] }
      responses:
        "200":
          description: Ledger
          content:
            application/json:
              schema:
                type: object
                properties:
                  party:
                    $ref: "#/components/schemas/DealerLedgerParty"
                  entries:
                    type: array
                    items:
                      $ref: "#/components/schemas/DealerLedgerEntry"
                  totals:
                    $ref: "#/components/schemas/DealerLedgerTotals"
                required: [party, entries, totals]
        "404":
          description: Unknown shop
  /dealers/transactions/{id}:
    get:
      operationId: dealerTransactionsGet
      tags: [business]
      summary: Dealer-transaction detail, from either side
      description: >-
        Returns the shared repair row plus the SAME payments, refunds,
        timeline and derived balance to whichever of the two shops asks.
        Anyone else gets 404.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Transaction detail
          content:
            application/json:
              schema:
                type: object
                properties:
                  repair:
                    $ref: "#/components/schemas/Repair"
                  counterpart:
                    description: >-
                      The OTHER party to this transaction: the source dealer
                      when viewed from the receiving shop, or the receiving
                      shop when viewed from the sending shop. Used to open the
                      dedicated dealer-to-dealer chat.
                    $ref: "#/components/schemas/DealerLookupMatch"
                  side:
                    type: string
                    enum: [receiver, sender]
                    description: Which party the caller is.
                  transactionCode: { type: string }
                  acceptance:
                    type: string
                    enum: [waiting, received]
                    description: waiting until the repairing shop explicitly confirms receipt.
                  financials:
                    description: Omitted unless the caller has the `payments` feature.
                    $ref: "#/components/schemas/DealerTransactionFinancials"
                  payments:
                    type: array
                    description: Omitted unless the caller has the `payments` feature.
                    items:
                      $ref: "#/components/schemas/RepairPayment"
                  refunds:
                    type: array
                    description: Omitted unless the caller has the `payments` feature.
                    items:
                      $ref: "#/components/schemas/Refund"
                  events:
                    type: array
                    description: Shared status timeline, oldest first (includes dealer_sent / dealer_received milestones). Payment events are omitted unless the caller has the `payments` feature.
                    items:
                      $ref: "#/components/schemas/RepairEvent"
                required: [repair, counterpart, side, transactionCode, acceptance, events]
        "404":
          description: Not found or not a party to this transaction
  /dealers/transactions/{id}/receive:
    post:
      operationId: dealerTransactionsReceive
      tags: [business]
      summary: Receiving shop confirms the device has physically arrived
      description: >-
        Only the receiving shop may call this. Idempotent — repeating after
        the first confirmation is a no-op that returns the same repair.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Acknowledged
          content:
            application/json:
              schema:
                type: object
                properties:
                  repair:
                    $ref: "#/components/schemas/Repair"
                required: [repair]
        "404":
          description: Not found in the caller's shop
  /customers:
    get:
      operationId: customersList
      tags: [business]
      summary: List customers of the caller's shop
      responses:
        "200":
          description: Customers
          content:
            application/json:
              schema:
                type: object
                properties:
                  customers:
                    type: array
                    items:
                      $ref: "#/components/schemas/Customer"
                required: [customers]
    post:
      operationId: customersCreate
      tags: [business]
      summary: Create a customer in the caller's shop
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CustomerInput"
      responses:
        "200":
          description: Created customer
          content:
            application/json:
              schema:
                type: object
                properties:
                  customer:
                    $ref: "#/components/schemas/Customer"
                required: [customer]
  /customers/{id}:
    patch:
      operationId: customersUpdate
      tags: [business]
      summary: Update a customer in the caller's shop
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CustomerInput"
      responses:
        "200":
          description: Updated customer
          content:
            application/json:
              schema:
                type: object
                properties:
                  customer:
                    $ref: "#/components/schemas/Customer"
                required: [customer]
  /customers/{id}/khata:
    get:
      operationId: customersKhataGet
      tags: [business]
      summary: Get a customer's unified repair and manual khata ledger
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Customer khata ledger
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerKhataLedger"
  /customers/{id}/khata/transactions:
    post:
      operationId: customersKhataTransactionsCreate
      tags: [business]
      summary: Append a manual customer khata transaction
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CustomerKhataTransactionInput"
      responses:
        "201":
          description: Transaction appended
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerKhataTransactionResult"
        "200":
          description: Existing idempotent transaction
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerKhataTransactionResult"
  /repairs:
    get:
      operationId: repairsList
      tags: [business]
      summary: List repairs of the caller's shop (search + pagination)
      parameters:
        - { name: q, in: query, required: false, schema: { type: string } }
        - { name: status, in: query, required: false, schema: { type: string } }
        - { name: paymentStatus, in: query, required: false, schema: { type: string, enum: [paid, partial, pending] } }
        - { name: technicianId, in: query, required: false, schema: { type: string } }
        - { name: receivedById, in: query, required: false, schema: { type: string } }
        - { name: priority, in: query, required: false, schema: { type: string } }
        - { name: dateFrom, in: query, required: false, schema: { type: string } }
        - { name: dateTo, in: query, required: false, schema: { type: string } }
        - { name: warranty, in: query, required: false, schema: { type: string, enum: [active, expired, none] } }
        - { name: dealerId, in: query, required: false, schema: { type: string } }
        - { name: page, in: query, required: false, schema: { type: number } }
        - { name: limit, in: query, required: false, schema: { type: number } }
      responses:
        "200":
          description: Repairs
          content:
            application/json:
              schema:
                type: object
                properties:
                  repairs:
                    type: array
                    items:
                      $ref: "#/components/schemas/Repair"
                  total: { type: number }
                  page: { type: number }
                  limit: { type: number }
                required: [repairs]
    post:
      operationId: repairsCreate
      tags: [business]
      summary: Create a repair ticket in the caller's shop
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RepairInput"
      responses:
        "200":
          description: Created repair
          content:
            application/json:
              schema:
                type: object
                properties:
                  repair:
                    $ref: "#/components/schemas/Repair"
                required: [repair]
  /repairs/{id}:
    get:
      operationId: repairsGet
      tags: [business]
      summary: Fetch one repair of the caller's shop by id
      description: |
        Same ownership predicate as the list. Portal roles (customer / dealer
