                    items:
                      $ref: "#/components/schemas/ChatRoom"
                required: [rooms]

  /chat/rooms/{roomId}:
    get:
      operationId: chatRoomsGet
      tags: [chat]
      summary: Get a single chat room (members only; unauthorized returns 404)
      parameters:
        - name: roomId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Room
          content:
            application/json:
              schema:
                type: object
                properties:
                  room:
                    $ref: "#/components/schemas/ChatRoom"
                required: [room]
    delete:
      operationId: chatRoomsDelete
      tags: [chat]
      summary: Hide a chat from the caller's inbox without deleting the shared room or any member's history
      parameters:
        - name: roomId
          in: path
          required: true
          schema: { type: string }
      responses:
        "204":
          description: Chat hidden for the caller
        "404":
          description: Room not found or caller is not a member

  /chat/rooms/{roomId}/preferences:
    patch:
      operationId: chatRoomsPreferencesUpdate
      tags: [chat]
      summary: Update caller-specific pin, mute, or archive state
      parameters:
        - name: roomId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
