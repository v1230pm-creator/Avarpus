        - { name: inventoryItemId, in: query, required: false, schema: { type: string } }
      responses:
        "200":
          description: Stock movements (newest first)
          content:
            application/json:
              schema:
                type: object
                properties:
                  stockMovements:
                    type: array
                    items: { $ref: "#/components/schemas/StockMovement" }
                required: [stockMovements]
  /customers/{id}/summary:
    get:
      operationId: customerSummary
      tags: [business]
      summary: Aggregate summary for a customer
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Customer summary
          content:
            application/json:
              schema:
                type: object
                properties:
                  summary: { $ref: "#/components/schemas/CustomerSummary" }
                required: [summary]
  /repairs/{id}/returns:
