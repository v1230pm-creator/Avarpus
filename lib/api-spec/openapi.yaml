openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Authentication operations
  - name: business
    description: Shop-scoped business data (repairs, customers, inventory, purchases, finance)
  - name: Storage
    description: Object storage upload and serving endpoints.
  - name: dashboard
    description: Read-only dashboard stats and activity feed.
paths:
  /auth/login:
    post:
      operationId: authLogin
      tags: [auth]
      summary: Sign in with email/mobile and password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSession"
  /auth/otp/request:
    post:
      operationId: authOtpRequest
      tags: [auth]
      summary: Request a login OTP for a mobile number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OtpRequestInput"
      responses:
        "200":
          description: OTP request accepted
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                required: [message]
  /auth/otp/verify:
    post:
      operationId: authOtpVerify
      tags: [auth]
      summary: Verify a login OTP and sign in
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OtpVerifyInput"
      responses:
        "200":
          description: Signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSession"
  /auth/register/start:
    post:
      operationId: authRegisterStart
      tags: [auth]
      summary: Start registration and send email OTP
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterStartInput"
      responses:
        "200":
          description: OTP sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
  /auth/register/verify:
    post:
      operationId: authRegisterVerify
      tags: [auth]
      summary: Verify email OTP and create the account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterVerifyInput"
      responses:
        "200":
          description: >
            Dealer accounts are created and signed in (token + user).
            Staff accounts are created pending approval (pending + message, no token).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegisterVerifyResult"
  /auth/forgot/request:
    post:
      operationId: authForgotRequest
      tags: [auth]
      summary: Request a password reset OTP
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ForgotRequestInput"
      responses:
        "200":
          description: Request accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
  /auth/forgot/verify:
    post:
      operationId: authForgotVerify
      tags: [auth]
      summary: Verify a password reset OTP
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterVerifyInput"
      responses:
        "200":
          description: Verified
          content:
            application/json:
              schema:
                type: object
                properties:
                  resetToken: { type: string }
                required: [resetToken]
  /auth/forgot/reset:
    post:
      operationId: authForgotReset
      tags: [auth]
      summary: Reset password with a reset token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ForgotResetInput"
      responses:
        "200":
          description: Password updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
  /auth/me:
    get:
      operationId: authMe
      tags: [auth]
      summary: Get the current authenticated user
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    $ref: "#/components/schemas/AuthUser"
                required: [user]
  /staff:
    get:
      operationId: staffList
      tags: [auth]
      summary: List staff of the current dealer's shop (dealer/super_admin only)
      responses:
        "200":
          description: Staff members
          content:
            application/json:
              schema:
                type: object
                properties:
                  staff:
                    type: array
                    items:
                      $ref: "#/components/schemas/AuthUser"
                required: [staff]
    post:
      operationId: staffCreate
      tags: [auth]
      summary: Create a staff account in the current dealer's shop (dealer/super_admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StaffCreateInput"
      responses:
        "200":
          description: Staff account created
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    $ref: "#/components/schemas/AuthUser"
                required: [user]
  /staff/{id}/activate:
    patch:
      operationId: staffActivate
      tags: [auth]
      summary: Approve a pending staff account (dealer/super_admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Activated account
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    $ref: "#/components/schemas/AuthUser"
                required: [user]
  /staff/{id}:
    patch:
      operationId: staffUpdate
      tags: [auth]
      summary: Update a staff member's profile (dealer/super_admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StaffUpdateInput"
      responses:
        "200":
          description: Updated account
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    $ref: "#/components/schemas/AuthUser"
                required: [user]
    delete:
      operationId: staffReject
      tags: [auth]
      summary: Reject and remove a pending staff account (dealer/super_admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Account removed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
  /auth/login-history:
    get:
      operationId: authLoginHistory
      tags: [auth]
      summary: List recent successful logins for the current user
      responses:
        "200":
          description: Login history
          content:
            application/json:
              schema:
                type: object
                properties:
                  events:
                    type: array
                    items:
                      $ref: "#/components/schemas/LoginEvent"
                required: [events]
  /auth/sessions:
    get:
      operationId: authSessions
      tags: [auth]
      summary: List active sessions for the current user
      responses:
        "200":
          description: Active sessions
          content:
            application/json:
              schema:
                type: object
                properties:
                  sessions:
                    type: array
                    items:
                      $ref: "#/components/schemas/SessionInfo"
                required: [sessions]
  /auth/sessions/{id}:
    delete:
      operationId: authRevokeSession
      tags: [auth]
      summary: Sign out a specific session by id
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Session revoked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
  /auth/sessions/revoke-others:
    post:
      operationId: authRevokeOtherSessions
      tags: [auth]
      summary: Sign out all sessions except the current one
      responses:
        "200":
          description: Other sessions revoked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
  /auth/logout:
    post:
      operationId: authLogout
      tags: [auth]
      summary: Sign out and invalidate the session
      responses:
        "200":
          description: Signed out
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
  /dealers:
    get:
      operationId: dealersList
      tags: [business]
      summary: List B2B dealers of the caller's shop with live repair counts
      parameters:
        - { name: q, in: query, required: false, schema: { type: string } }
      responses:
        "200":
          description: Dealers
          content:
            application/json:
              schema:
                type: object
                properties:
                  dealers:
                    type: array
                    items:
                      $ref: "#/components/schemas/DealerWithCounts"
                required: [dealers]
    post:
      operationId: dealersCreate
      tags: [business]
      summary: Create a B2B dealer in the caller's shop
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DealerInput"
      responses:
        "200":
          description: Created dealer
          content:
            application/json:
              schema:
                type: object
                properties:
                  dealer:
                    $ref: "#/components/schemas/Dealer"
                required: [dealer]
  /dealers/me:
    get:
      operationId: dealersMe
      tags: [business]
      summary: Dealer-portal account's own dealer profile + stats
      responses:
        "200":
          description: Own dealer profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DealerProfile"
  /dealers/overview:
    get:
      operationId: dealersOverview
      tags: [business]
      summary: Overall dealer-repair statistics (dealer/owner only)
      responses:
        "200":
          description: Overview stats
          content:
            application/json:
              schema:
                type: object
                properties:
                  stats:
                    $ref: "#/components/schemas/DealerOverviewStats"
                required: [stats]
  /dealers/{id}:
    get:
      operationId: dealersGet
      tags: [business]
      summary: Dealer profile + full stats
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Dealer profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DealerProfile"
    patch:
      operationId: dealersUpdate
      tags: [business]
      summary: Update a dealer (dealer/owner only)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DealerInput"
      responses:
        "200":
          description: Updated dealer
          content:
            application/json:
              schema:
                type: object
                properties:
                  dealer:
                    $ref: "#/components/schemas/Dealer"
                required: [dealer]
  /customers:
    get:
      operationId: customersList
      tags: [business]
      summary: List customers of the caller's shop
      responses:
        "200":
          description: Customers
          content:
            application/json:
              schema:
                type: object
                properties:
                  customers:
                    type: array
                    items:
                      $ref: "#/components/schemas/Customer"
                required: [customers]
    post:
      operationId: customersCreate
      tags: [business]
      summary: Create a customer in the caller's shop
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CustomerInput"
      responses:
        "200":
          description: Created customer
          content:
            application/json:
              schema:
                type: object
                properties:
                  customer:
                    $ref: "#/components/schemas/Customer"
                required: [customer]
  /customers/{id}:
    patch:
      operationId: customersUpdate
      tags: [business]
      summary: Update a customer in the caller's shop
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CustomerInput"
      responses:
        "200":
          description: Updated customer
          content:
            application/json:
              schema:
                type: object
                properties:
                  customer:
                    $ref: "#/components/schemas/Customer"
                required: [customer]
  /repairs:
    get:
      operationId: repairsList
      tags: [business]
      summary: List repairs of the caller's shop (search + pagination)
      parameters:
        - { name: q, in: query, required: false, schema: { type: string } }
        - { name: status, in: query, required: false, schema: { type: string } }
        - { name: paymentStatus, in: query, required: false, schema: { type: string, enum: [paid, partial, pending] } }
        - { name: technicianId, in: query, required: false, schema: { type: string } }
        - { name: receivedById, in: query, required: false, schema: { type: string } }
        - { name: priority, in: query, required: false, schema: { type: string } }
        - { name: dateFrom, in: query, required: false, schema: { type: string } }
        - { name: dateTo, in: query, required: false, schema: { type: string } }
        - { name: warranty, in: query, required: false, schema: { type: string, enum: [active, expired, none] } }
        - { name: dealerId, in: query, required: false, schema: { type: string } }
        - { name: page, in: query, required: false, schema: { type: number } }
        - { name: limit, in: query, required: false, schema: { type: number } }
      responses:
        "200":
          description: Repairs
          content:
            application/json:
              schema:
                type: object
                properties:
                  repairs:
                    type: array
                    items:
                      $ref: "#/components/schemas/Repair"
                  total: { type: number }
                  page: { type: number }
                  limit: { type: number }
                required: [repairs]
    post:
      operationId: repairsCreate
      tags: [business]
      summary: Create a repair ticket in the caller's shop
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RepairInput"
      responses:
        "200":
          description: Created repair
          content:
            application/json:
              schema:
                type: object
                properties:
                  repair:
                    $ref: "#/components/schemas/Repair"
                required: [repair]
  /repairs/{id}:
    patch:
      operationId: repairsUpdate
      tags: [business]
      summary: Update a repair in the caller's shop
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RepairInput"
      responses:
        "200":
          description: Updated repair
          content:
            application/json:
              schema:
                type: object
                properties:
                  repair:
                    $ref: "#/components/schemas/Repair"
                required: [repair]
    delete:
      operationId: repairsDelete
      tags: [business]
      summary: Permanently delete a repair (dealer/owner only)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Repair deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                required: [message]
  /repairs/{id}/photos:
    get:
      operationId: repairPhotosList
      tags: [business]
      summary: List photos/documents attached to a repair
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Photos
          content:
            application/json:
              schema:
                type: object
                properties:
                  photos:
                    type: array
                    items:
                      $ref: "#/components/schemas/RepairPhoto"
                required: [photos]
    post:
      operationId: repairPhotosAdd
      tags: [business]
      summary: Attach an uploaded photo/document to a repair
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RepairPhotoInput"
      responses:
        "200":
          description: Created photo record
          content:
            application/json:
              schema:
                type: object
                properties:
                  photo:
                    $ref: "#/components/schemas/RepairPhoto"
                required: [photo]
  /repairs/{id}/parts:
    get:
      operationId: repairPartsList
      tags: [business]
      summary: List parts consumed on a repair
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Parts
          content:
            application/json:
              schema:
                type: object
                properties:
                  parts:
                    type: array
                    items:
                      $ref: "#/components/schemas/RepairPart"
                  canSeeCosts: { type: boolean }
                required: [parts]
    post:
      operationId: repairPartsAdd
      tags: [business]
      summary: Record a part used on a repair (deducts inventory)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RepairPartInput"
      responses:
        "200":
          description: Created part row
          content:
            application/json:
              schema:
                type: object
                properties:
                  part:
                    $ref: "#/components/schemas/RepairPart"
                required: [part]
  /repairs/{id}/events:
    get:
      operationId: repairEventsList
      tags: [business]
      summary: List the immutable activity timeline of a repair
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Events (newest first)
          content:
            application/json:
              schema:
                type: object
                properties:
                  events:
                    type: array
                    items:
                      $ref: "#/components/schemas/RepairEvent"
                required: [events]
  /repairs/{id}/payments:
    get:
      operationId: repairPaymentsList
      tags: [business]
      summary: List the payment ledger of a repair
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Payments (newest first)
          content:
            application/json:
              schema:
                type: object
                properties:
                  payments:
                    type: array
                    items: { $ref: "#/components/schemas/RepairPayment" }
                  refunds:
                    type: array
                    items: { $ref: "#/components/schemas/Refund" }
                required: [payments]
    post:
      operationId: repairPaymentsCreate
      tags: [business]
      summary: Record a payment against a repair (append-only ledger)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RepairPaymentInput" }
      responses:
        "200":
          description: Recorded payment
          content:
            application/json:
              schema:
                type: object
                properties:
                  payment: { $ref: "#/components/schemas/RepairPayment" }
                required: [payment]
  /repairs/{id}/assign:
    post:
      operationId: repairAssignTechnician
      tags: [business]
      summary: Assign a technician to a repair (dealer/owner only)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RepairAssignInput" }
      responses:
        "200":
          description: Updated repair
          content:
            application/json:
              schema:
                type: object
                properties:
                  repair: { $ref: "#/components/schemas/Repair" }
                required: [repair]
  /repairs/{id}/testing:
    post:
      operationId: repairTesting
      tags: [business]
      summary: Save the final testing checklist and optionally confirm it
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RepairTestingInput" }
      responses:
        "200":
          description: Updated repair
          content:
            application/json:
              schema:
                type: object
                properties:
                  repair: { $ref: "#/components/schemas/Repair" }
                required: [repair]
  /repairs/{id}/estimate-approvals:
    get:
      operationId: estimateApprovalsList
      tags: [business]
      summary: List estimate/customer-approval requests for a repair
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Estimate approvals
          content:
            application/json:
              schema:
                type: object
                properties:
                  estimateApprovals:
                    type: array
                    items: { $ref: "#/components/schemas/EstimateApproval" }
                required: [estimateApprovals]
    post:
      operationId: estimateApprovalsCreate
      tags: [business]
      summary: Request customer approval for a new estimate amount
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EstimateApprovalCreateInput" }
      responses:
        "200":
          description: Created estimate approval
          content:
            application/json:
              schema:
                type: object
                properties:
                  estimateApproval: { $ref: "#/components/schemas/EstimateApproval" }
                required: [estimateApproval]
  /estimate-approvals/{id}/decide:
    post:
      operationId: estimateApprovalsDecide
      tags: [business]
      summary: Decide an estimate approval (dealer manual or customer OTP)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EstimateApprovalDecideInput" }
      responses:
        "200":
          description: Decided estimate approval
          content:
            application/json:
              schema:
                type: object
                properties:
                  estimateApproval: { $ref: "#/components/schemas/EstimateApproval" }
                required: [estimateApproval]
  /estimate-approvals/{id}/send-otp:
    post:
      operationId: estimateApprovalsSendOtp
      tags: [business]
      summary: Email a 6-digit OTP to the repair's customer
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: OTP sent
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Message" }
  /repairs/{id}/delivery-otp/send:
    post:
      operationId: deliveryOtpSend
      tags: [business]
      summary: Email a delivery-confirmation OTP to the customer
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: OTP sent
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Message" }
  /repairs/{id}/delivery-otp/verify:
    post:
      operationId: deliveryOtpVerify
      tags: [business]
      summary: Verify the delivery-confirmation OTP
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DeliveryOtpVerifyInput" }
      responses:
        "200":
          description: Verified
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                  otpVerified: { type: boolean }
                required: [message]
  /repairs/{id}/notify-ready:
    post:
      operationId: repairNotifyReady
      tags: [business]
      summary: Email the customer that the device is ready for pickup
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Notified
          content:
            application/json:
              schema:
                type: object
                properties:
                  repair: { $ref: "#/components/schemas/Repair" }
                required: [repair]
  /stock-movements:
    get:
      operationId: stockMovementsList
