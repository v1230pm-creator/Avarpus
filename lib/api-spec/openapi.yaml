openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Authentication operations
  - name: business
    description: Shop-scoped business data (repairs, customers, inventory, purchases, finance)
paths:
  /auth/login:
    post:
      operationId: authLogin
      tags: [auth]
      summary: Sign in with email/mobile and password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSession"
  /auth/otp/request:
    post:
      operationId: authOtpRequest
      tags: [auth]
      summary: Request a login OTP for a mobile number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OtpRequestInput"
      responses:
        "200":
          description: OTP request accepted
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                required: [message]
  /auth/otp/verify:
    post:
      operationId: authOtpVerify
      tags: [auth]
      summary: Verify a login OTP and sign in
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OtpVerifyInput"
      responses:
        "200":
          description: Signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSession"
  /auth/register/start:
    post:
      operationId: authRegisterStart
      tags: [auth]
      summary: Start registration and send email OTP
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterStartInput"
      responses:
        "200":
          description: OTP sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
  /auth/register/verify:
    post:
      operationId: authRegisterVerify
      tags: [auth]
      summary: Verify email OTP and create the account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterVerifyInput"
      responses:
        "200":
          description: Dealer account created and signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSession"
  /auth/forgot/request:
    post:
      operationId: authForgotRequest
      tags: [auth]
      summary: Request a password reset OTP
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ForgotRequestInput"
      responses:
        "200":
          description: Request accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
  /auth/forgot/verify:
    post:
      operationId: authForgotVerify
      tags: [auth]
      summary: Verify a password reset OTP
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterVerifyInput"
      responses:
        "200":
          description: Verified
          content:
            application/json:
              schema:
                type: object
                properties:
                  resetToken: { type: string }
                required: [resetToken]
  /auth/forgot/reset:
    post:
      operationId: authForgotReset
      tags: [auth]
      summary: Reset password with a reset token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ForgotResetInput"
      responses:
        "200":
          description: Password updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
  /auth/me:
    get:
      operationId: authMe
      tags: [auth]
      summary: Get the current authenticated user
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    $ref: "#/components/schemas/AuthUser"
                required: [user]
  /staff:
    get:
      operationId: staffList
      tags: [auth]
      summary: List staff of the current dealer's shop (dealer/super_admin only)
      responses:
        "200":
          description: Staff members
          content:
            application/json:
              schema:
                type: object
                properties:
                  staff:
                    type: array
                    items:
                      $ref: "#/components/schemas/AuthUser"
                required: [staff]
    post:
      operationId: staffCreate
      tags: [auth]
      summary: Create a staff account in the current dealer's shop (dealer/super_admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StaffCreateInput"
      responses:
        "200":
          description: Staff account created
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    $ref: "#/components/schemas/AuthUser"
                required: [user]
  /auth/login-history:
    get:
      operationId: authLoginHistory
      tags: [auth]
      summary: List recent successful logins for the current user
      responses:
        "200":
          description: Login history
          content:
            application/json:
              schema:
                type: object
                properties:
                  events:
                    type: array
                    items:
                      $ref: "#/components/schemas/LoginEvent"
                required: [events]
  /auth/sessions:
    get:
      operationId: authSessions
      tags: [auth]
      summary: List active sessions for the current user
      responses:
        "200":
          description: Active sessions
          content:
            application/json:
              schema:
                type: object
                properties:
                  sessions:
                    type: array
                    items:
                      $ref: "#/components/schemas/SessionInfo"
                required: [sessions]
  /auth/sessions/{id}:
    delete:
      operationId: authRevokeSession
      tags: [auth]
      summary: Sign out a specific session by id
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Session revoked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
  /auth/sessions/revoke-others:
    post:
      operationId: authRevokeOtherSessions
      tags: [auth]
      summary: Sign out all sessions except the current one
      responses:
        "200":
          description: Other sessions revoked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
  /auth/logout:
    post:
      operationId: authLogout
      tags: [auth]
      summary: Sign out and invalidate the session
      responses:
        "200":
          description: Signed out
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
  /customers:
    get:
      operationId: customersList
      tags: [business]
      summary: List customers of the caller's shop
      responses:
        "200":
          description: Customers
          content:
            application/json:
              schema:
                type: object
                properties:
                  customers:
                    type: array
                    items:
                      $ref: "#/components/schemas/Customer"
                required: [customers]
    post:
      operationId: customersCreate
      tags: [business]
      summary: Create a customer in the caller's shop
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CustomerInput"
      responses:
        "200":
          description: Created customer
          content:
            application/json:
              schema:
                type: object
                properties:
                  customer:
                    $ref: "#/components/schemas/Customer"
                required: [customer]
  /customers/{id}:
    patch:
      operationId: customersUpdate
      tags: [business]
      summary: Update a customer in the caller's shop
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CustomerInput"
      responses:
        "200":
          description: Updated customer
          content:
            application/json:
              schema:
                type: object
                properties:
                  customer:
                    $ref: "#/components/schemas/Customer"
                required: [customer]
  /repairs:
    get:
      operationId: repairsList
      tags: [business]
      summary: List repairs of the caller's shop
      responses:
        "200":
          description: Repairs
          content:
            application/json:
              schema:
                type: object
                properties:
                  repairs:
                    type: array
                    items:
                      $ref: "#/components/schemas/Repair"
                required: [repairs]
    post:
      operationId: repairsCreate
      tags: [business]
      summary: Create a repair ticket in the caller's shop
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RepairInput"
      responses:
        "200":
          description: Created repair
          content:
            application/json:
              schema:
                type: object
                properties:
                  repair:
                    $ref: "#/components/schemas/Repair"
                required: [repair]
  /repairs/{id}:
    patch:
      operationId: repairsUpdate
      tags: [business]
      summary: Update a repair in the caller's shop
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RepairInput"
      responses:
        "200":
          description: Updated repair
          content:
            application/json:
              schema:
                type: object
                properties:
                  repair:
                    $ref: "#/components/schemas/Repair"
                required: [repair]
  /inventory:
    get:
      operationId: inventoryList
      tags: [business]
      summary: List inventory items of the caller's shop
      responses:
        "200":
          description: Inventory items
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/InventoryItem"
                required: [items]
    post:
      operationId: inventoryCreate
      tags: [business]
      summary: Create an inventory item in the caller's shop
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InventoryItemInput"
      responses:
        "200":
          description: Created inventory item
          content:
            application/json:
              schema:
                type: object
                properties:
                  item:
                    $ref: "#/components/schemas/InventoryItem"
                required: [item]
  /inventory/{id}:
    patch:
      operationId: inventoryUpdate
      tags: [business]
      summary: Update an inventory item in the caller's shop
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InventoryItemInput"
      responses:
        "200":
          description: Updated inventory item
          content:
            application/json:
              schema:
                type: object
                properties:
                  item:
                    $ref: "#/components/schemas/InventoryItem"
                required: [item]
  /purchases:
    get:
      operationId: purchasesList
      tags: [business]
      summary: List purchases of the caller's shop
      responses:
        "200":
          description: Purchases
          content:
            application/json:
              schema:
                type: object
                properties:
                  purchases:
                    type: array
                    items:
                      $ref: "#/components/schemas/Purchase"
                required: [purchases]
    post:
      operationId: purchasesCreate
      tags: [business]
      summary: Record a purchase in the caller's shop
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PurchaseInput"
      responses:
        "200":
          description: Created purchase
          content:
            application/json:
              schema:
                type: object
                properties:
                  purchase:
                    $ref: "#/components/schemas/Purchase"
                required: [purchase]
  /finance:
    get:
      operationId: financeList
      tags: [business]
      summary: List finance entries of the caller's shop
      responses:
        "200":
          description: Finance entries
          content:
            application/json:
              schema:
                type: object
                properties:
                  entries:
                    type: array
                    items:
                      $ref: "#/components/schemas/FinanceEntry"
                required: [entries]
    post:
      operationId: financeCreate
      tags: [business]
      summary: Record a finance entry in the caller's shop
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FinanceEntryInput"
      responses:
        "200":
          description: Created finance entry
          content:
            application/json:
              schema:
                type: object
                properties:
                  entry:
                    $ref: "#/components/schemas/FinanceEntry"
                required: [entry]
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
components:
  schemas:
    LoginInput:
      type: object
      properties:
        emailOrMobile: { type: string }
        password: { type: string }
        rememberMe: { type: boolean }
        device: { type: string }
      required: [emailOrMobile, password]
    ForgotRequestInput:
      type: object
      properties:
        email: { type: string }
      required: [email]
    ForgotResetInput:
      type: object
      properties:
        email: { type: string }
        resetToken: { type: string }
        newPassword: { type: string }
      required: [email, resetToken, newPassword]
    OtpRequestInput:
      type: object
      properties:
        mobile: { type: string }
      required: [mobile]
    OtpVerifyInput:
      type: object
      properties:
        mobile: { type: string }
        code: { type: string }
        rememberMe: { type: boolean }
        device: { type: string }
      required: [mobile, code]
    RegisterStartInput:
      type: object
      properties:
        name: { type: string }
        businessName: { type: string }
        email: { type: string }
        mobile: { type: string }
        password: { type: string }
        gstNumber: { type: string }
        shopAddress: { type: string }
      required: [name, businessName, email, mobile, password, shopAddress]
    RegisterVerifyInput:
      type: object
      properties:
        email: { type: string }
        code: { type: string }
      required: [email, code]
    LoginEvent:
      type: object
      properties:
        id: { type: string }
        method: { type: string }
        rememberMe: { type: boolean }
        deviceInfo: { type: string }
        createdAt: { type: string }
      required: [id, method, rememberMe, createdAt]
    SessionInfo:
      type: object
      properties:
        id: { type: string }
        deviceInfo: { type: string }
        createdAt: { type: string }
        expiresAt: { type: string }
        current: { type: boolean }
      required: [id, createdAt, expiresAt, current]
    Message:
      type: object
      properties:
        message: { type: string }
      required: [message]
    AuthUser:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        email: { type: string }
        mobile: { type: string }
        role: { type: string }
        isActive: { type: boolean }
        designation: { type: string }
        joinDate: { type: string }
        businessName: { type: string }
        gstNumber: { type: string }
        shopAddress: { type: string }
        profilePhoto: { type: string }
        companyLogo: { type: string }
        shopId: { type: string }
      required: [id, name, email, mobile, role, isActive]
    StaffCreateInput:
      type: object
      properties:
        name: { type: string }
        email: { type: string }
        mobile: { type: string }
        password: { type: string }
        role: { type: string, enum: [reception, technician, store_manager, accountant] }
        designation: { type: string }
      required: [name, email, mobile, password, role]
    AuthSession:
      type: object
      properties:
        token: { type: string }
        user:
          $ref: "#/components/schemas/AuthUser"
      required: [token, user]
    Customer:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        mobile: { type: string }
        email: { type: string }
        address: { type: string }
        dueAmount: { type: number }
        totalRepairs: { type: number }
        createdAt: { type: string }
      required: [id, name, mobile, dueAmount, totalRepairs, createdAt]
    CustomerInput:
      type: object
      properties:
        name: { type: string }
        mobile: { type: string }
        email: { type: string }
        address: { type: string }
        dueAmount: { type: number }
        totalRepairs: { type: number }
    Repair:
      type: object
      properties:
        id: { type: string }
        repairId: { type: string }
        customerId: { type: string }
        customerName: { type: string }
        mobile: { type: string }
        deviceType: { type: string }
        brand: { type: string }
        model: { type: string }
        imei: { type: string }
        problem: { type: string }
        technicianId: { type: string }
        technicianName: { type: string }
        status: { type: string }
        priority: { type: string }
        repairCharge: { type: number }
        partsCharge: { type: number }
        advance: { type: number }
        receiveDate: { type: string }
        expectedDate: { type: string }
        deliveryDate: { type: string }
        notes: { type: string }
        createdAt: { type: string }
      required: [id, repairId, customerName, mobile, deviceType, brand, model, problem, status, priority, repairCharge, partsCharge, advance, receiveDate, expectedDate, createdAt]
    RepairInput:
      type: object
      properties:
        customerId: { type: string }
        customerName: { type: string }
        mobile: { type: string }
        deviceType: { type: string }
        brand: { type: string }
        model: { type: string }
        imei: { type: string }
        problem: { type: string }
        technicianId: { type: string }
        technicianName: { type: string }
        status: { type: string }
        priority: { type: string }
        repairCharge: { type: number }
        partsCharge: { type: number }
        advance: { type: number }
        receiveDate: { type: string }
        expectedDate: { type: string }
        deliveryDate: { type: string }
        notes: { type: string }
    InventoryItem:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        category: { type: string }
        brand: { type: string }
        quantity: { type: number }
        minStock: { type: number }
        purchasePrice: { type: number }
        sellingPrice: { type: number }
        supplier: { type: string }
        createdAt: { type: string }
      required: [id, name, category, brand, quantity, minStock, purchasePrice, sellingPrice, createdAt]
    InventoryItemInput:
      type: object
      properties:
        name: { type: string }
        category: { type: string }
        brand: { type: string }
        quantity: { type: number }
        minStock: { type: number }
        purchasePrice: { type: number }
        sellingPrice: { type: number }
        supplier: { type: string }
    Purchase:
      type: object
      properties:
        id: { type: string }
        purchaseId: { type: string }
        invoiceNo: { type: string }
        supplier: { type: string }
        supplierMobile: { type: string }
        itemName: { type: string }
        quantity: { type: number }
        purchasePrice: { type: number }
        total: { type: number }
        paymentStatus: { type: string }
        paymentMethod: { type: string }
        date: { type: string }
        createdAt: { type: string }
      required: [id, purchaseId, invoiceNo, supplier, itemName, quantity, purchasePrice, total, paymentStatus, paymentMethod, date, createdAt]
    PurchaseInput:
      type: object
      properties:
        invoiceNo: { type: string }
        supplier: { type: string }
        supplierMobile: { type: string }
        itemName: { type: string }
        quantity: { type: number }
        purchasePrice: { type: number }
        total: { type: number }
        paymentStatus: { type: string }
        paymentMethod: { type: string }
        date: { type: string }
    FinanceEntry:
      type: object
      properties:
        id: { type: string }
        type: { type: string }
        category: { type: string }
        amount: { type: number }
        description: { type: string }
        paymentMethod: { type: string }
        date: { type: string }
        createdAt: { type: string }
      required: [id, type, category, amount, description, paymentMethod, date, createdAt]
    FinanceEntryInput:
      type: object
      properties:
        type: { type: string }
        category: { type: string }
        amount: { type: number }
        description: { type: string }
        paymentMethod: { type: string }
        date: { type: string }
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
