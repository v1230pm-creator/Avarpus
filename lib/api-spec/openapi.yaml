                  refunds:
                    type: array
                    items: { $ref: "#/components/schemas/Refund" }
                required: [return, parts, refunds]
    patch:
      operationId: returnsUpdate
      tags: [business]
      summary: Update a return case (status, inspection, resolution; some transitions dealer-only)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReturnUpdateInput"
      responses:
        "200":
          description: Updated return case
          content:
            application/json:
              schema:
                type: object
                properties:
                  return: { $ref: "#/components/schemas/RepairReturn" }
                required: [return]
  /returns/{id}/parts:
    post:
      operationId: returnPartsAdd
      tags: [business]
      summary: Record a part used in rework (deducts inventory)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReturnPartInput"
      responses:
        "200":
          description: Added part
          content:
            application/json:
              schema:
                type: object
                properties:
                  part: { $ref: "#/components/schemas/ReturnPart" }
                required: [part]
  /returns/{id}/refunds:
    post:
      operationId: refundsCreate
      tags: [business]
      summary: Request a refund for a return (staff → pending approval; dealer → approved)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefundCreateInput"
      responses:
        "200":
          description: Created refund
          content:
            application/json:
              schema:
                type: object
                properties:
                  refund: { $ref: "#/components/schemas/Refund" }
                required: [refund]
  /refunds:
    get:
      operationId: refundsList
      tags: [business]
      summary: List the shop's refunds (dealer/super_admin/accountant only)
      description: >
        Refund amounts are money figures — restricted to finance-visible roles
        (dealer, super_admin, accountant). Other roles receive 403.
      responses:
        "200":
          description: Refunds, newest first
          content:
            application/json:
              schema:
                type: object
                properties:
                  refunds:
                    type: array
                    items: { $ref: "#/components/schemas/Refund" }
                  pendingCount: { type: number }
                required: [refunds, pendingCount]
        "403":
          description: Caller's role may not view refunds
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
  /refunds/{id}/approve:
    post:
      operationId: refundsApprove
      tags: [business]
      summary: Approve a pending refund, optionally adjusting the amount (dealer only)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefundApproveInput"
      responses:
        "200":
          description: Approved refund
          content:
            application/json:
              schema:
                type: object
                properties:
                  refund: { $ref: "#/components/schemas/Refund" }
                required: [refund]
  /refunds/{id}/reject:
    post:
      operationId: refundsReject
      tags: [business]
      summary: Reject a pending refund with a reason (dealer only)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefundRejectInput"
      responses:
        "200":
          description: Rejected refund
          content:
            application/json:
              schema:
                type: object
                properties:
                  refund: { $ref: "#/components/schemas/Refund" }
                required: [refund]
  /refunds/{id}/mark-paid:
    post:
      operationId: refundsMarkPaid
      tags: [business]
      summary: Mark an approved refund as paid — records the REFUND expense in finance (dealer only)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefundMarkPaidInput"
      responses:
        "200":
          description: Paid refund
          content:
            application/json:
              schema:
                type: object
                properties:
                  refund: { $ref: "#/components/schemas/Refund" }
                required: [refund]
  /approvals:
    get:
      operationId: approvalsList
      tags: [business]
      summary: List backdated-entry approval requests (dealer sees all of the shop's; staff see their own)
      responses:
        "200":
          description: Approval requests, newest first
          content:
            application/json:
              schema:
                type: object
                properties:
                  approvals:
                    type: array
                    items:
                      $ref: "#/components/schemas/ApprovalRequest"
                  pendingCount: { type: number }
                required: [approvals, pendingCount]
    post:
      operationId: approvalsCreate
      tags: [business]
      summary: Request dealer approval for a backdated record
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApprovalRequestInput"
      responses:
        "200":
          description: Created request
          content:
            application/json:
              schema:
                type: object
                properties:
                  approval:
                    $ref: "#/components/schemas/ApprovalRequest"
                required: [approval]
  /approvals/{id}/approve:
    post:
      operationId: approvalsApprove
      tags: [business]
      summary: Approve a pending backdated request and save the record (dealer only)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Approved request
          content:
            application/json:
              schema:
                type: object
                properties:
                  approval:
                    $ref: "#/components/schemas/ApprovalRequest"
                required: [approval]
  /approvals/{id}/reject:
    post:
      operationId: approvalsReject
      tags: [business]
      summary: Reject a pending backdated request (dealer only)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApprovalRejectInput"
      responses:
        "200":
          description: Rejected request
          content:
            application/json:
              schema:
                type: object
                properties:
                  approval:
                    $ref: "#/components/schemas/ApprovalRequest"
                required: [approval]
  /storage/uploads/request-url:
    post:
      tags: [Storage]
      operationId: requestUploadUrl
      summary: Request a presigned URL for file upload
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UploadUrlRequest'
      responses:
        '200':
          description: Presigned upload URL generated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadUrlResponse'
        '400':
          description: Missing or invalid required fields.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /storage/objects/{objectPath}:
    get:
      tags: [Storage]
      operationId: getStorageObject
      summary: Serve an object entity from PRIVATE_OBJECT_DIR
      parameters:
        - name: objectPath
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Object content streamed with correct Content-Type.
          content:
            '*/*':
              schema: { type: string, format: binary }
        '404':
          description: Object not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /inventory:
    get:
      operationId: inventoryList
      tags: [business]
      summary: List inventory items of the caller's shop
      responses:
        "200":
          description: Inventory items
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/InventoryItem"
                  canSeeCosts: { type: boolean }
                required: [items]
    post:
      operationId: inventoryCreate
      tags: [business]
      summary: Create an inventory item in the caller's shop
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InventoryItemInput"
      responses:
        "200":
          description: Created inventory item
          content:
            application/json:
              schema:
                type: object
                properties:
                  item:
                    $ref: "#/components/schemas/InventoryItem"
                required: [item]
  /inventory/{id}:
    patch:
      operationId: inventoryUpdate
      tags: [business]
      summary: Update an inventory item in the caller's shop
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InventoryItemInput"
      responses:
        "200":
          description: Updated inventory item
          content:
            application/json:
              schema:
                type: object
                properties:
                  item:
                    $ref: "#/components/schemas/InventoryItem"
                required: [item]
  /purchases:
    get:
      operationId: purchasesList
      tags: [business]
      summary: List purchases of the caller's shop
      responses:
        "200":
          description: Purchases
          content:
            application/json:
              schema:
                type: object
                properties:
                  purchases:
                    type: array
                    items:
                      $ref: "#/components/schemas/Purchase"
                required: [purchases]
    post:
      operationId: purchasesCreate
      tags: [business]
      summary: Record a purchase in the caller's shop
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PurchaseInput"
      responses:
        "200":
          description: Created purchase
          content:
            application/json:
              schema:
                type: object
                properties:
                  purchase:
                    $ref: "#/components/schemas/Purchase"
                required: [purchase]
  /purchases/{id}:
    patch:
      operationId: purchasesUpdate
      tags: [business]
      summary: Update a purchase in the caller's shop
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PurchaseInput"
      responses:
        "200":
          description: Updated purchase
          content:
            application/json:
              schema:
                type: object
                properties:
                  purchase:
                    $ref: "#/components/schemas/Purchase"
                required: [purchase]
  /finance:
    get:
      operationId: financeList
      tags: [business]
      summary: List finance entries of the caller's shop
      responses:
        "200":
          description: Finance entries
          content:
            application/json:
              schema:
                type: object
                properties:
                  entries:
                    type: array
                    items:
                      $ref: "#/components/schemas/FinanceEntry"
                required: [entries]
    post:
      operationId: financeCreate
      tags: [business]
      summary: Record a finance entry in the caller's shop
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FinanceEntryInput"
      responses:
        "200":
          description: Created finance entry
          content:
            application/json:
              schema:
                type: object
                properties:
                  entry:
                    $ref: "#/components/schemas/FinanceEntry"
                required: [entry]
  /finance/{id}:
    patch:
      operationId: financeUpdate
      tags: [business]
      summary: Update a finance entry in the caller's shop
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FinanceEntryInput"
      responses:
        "200":
          description: Updated finance entry
          content:
            application/json:
              schema:
                type: object
                properties:
                  entry:
                    $ref: "#/components/schemas/FinanceEntry"
                required: [entry]
  /sample-data:
    post:
      operationId: sampleDataLoad
      tags: [business]
      summary: Seed labelled sample data into the caller's shop
      responses:
        "200":
          description: Sample data loaded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
        "409":
          description: Sample data already loaded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
    delete:
      operationId: sampleDataClear
      tags: [business]
      summary: Remove all sample data from the caller's shop
      responses:
        "200":
          description: Sample data cleared
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
  /dashboard/stats:
    get:
      operationId: dashboardStats
      tags: [dashboard]
      summary: Aggregate dashboard stats for the caller's shop
      description: >
        Real-time counts and (for finance-visible roles) money figures.
        Non-finance roles receive canSeeFinance:false and no money fields.
      responses:
        "200":
          description: Stats
          content:
            application/json:
              schema:
                type: object
                properties:
                  stats:
                    $ref: "#/components/schemas/DashboardStats"
                required: [stats]
  /activity:
    get:
      operationId: activityFeed
      tags: [dashboard]
      summary: Global activity feed (dealer/super_admin only)
      description: Merged, paginated audit feed of repair events and login events for the shop.
      parameters:
        - { name: page, in: query, required: false, schema: { type: number } }
        - { name: limit, in: query, required: false, schema: { type: number } }
        - { name: dateFrom, in: query, required: false, schema: { type: string } }
        - { name: dateTo, in: query, required: false, schema: { type: string } }
        - { name: type, in: query, required: false, schema: { type: string, enum: [repair, login] } }
      responses:
        "200":
          description: Activity feed
          content:
            application/json:
              schema:
                type: object
                properties:
                  activity:
                    type: array
                    items:
                      $ref: "#/components/schemas/Activity"
                  page: { type: number }
                  limit: { type: number }
                  hasMore: { type: boolean }
                required: [activity, page, limit, hasMore]
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
components:
  schemas:
    DashboardStats:
      type: object
      properties:
        todayRepairs: { type: number }
        pendingRepairs: { type: number }
        readyForPickup: { type: number }
        totalCustomers: { type: number }
        openApprovalRequests: { type: number }
        openReturnCases: { type: number }
        canSeeFinance: { type: boolean }
        todayIncome: { type: number }
        todayExpense: { type: number }
        pendingPayments: { type: number }
        refundsTotal: { type: number }
        refundsToday: { type: number }
      required:
        - todayRepairs
        - pendingRepairs
        - readyForPickup
        - totalCustomers
        - openApprovalRequests
        - openReturnCases
        - canSeeFinance
    Activity:
      type: object
      properties:
        id: { type: string }
        type: { type: string, enum: [repair, login] }
        action: { type: string }
        userId: { type: string, nullable: true }
        userName: { type: string }
        userRole: { type: string }
        repairId: { type: string, nullable: true }
        details: { type: object, nullable: true, additionalProperties: true }
        createdAt: { type: string }
      required: [id, type, action, userName, userRole, createdAt]
    LoginInput:
      type: object
      properties:
        emailOrMobile: { type: string }
        password: { type: string }
        rememberMe: { type: boolean }
        device: { type: string }
      required: [emailOrMobile, password]
    ForgotRequestInput:
      type: object
      properties:
        email: { type: string }
      required: [email]
    ForgotResetInput:
      type: object
      properties:
        email: { type: string }
        resetToken: { type: string }
        newPassword: { type: string }
      required: [email, resetToken, newPassword]
    OtpRequestInput:
      type: object
      properties:
        mobile: { type: string }
      required: [mobile]
    OtpVerifyInput:
      type: object
      properties:
        mobile: { type: string }
        code: { type: string }
        rememberMe: { type: boolean }
        device: { type: string }
      required: [mobile, code]
    RegisterStartInput:
      type: object
      properties:
        name: { type: string }
        businessName: { type: string }
        email: { type: string }
        mobile: { type: string }
        password: { type: string }
        gstNumber: { type: string }
        shopAddress: { type: string }
        role:
          type: string
          enum: [dealer, reception, technician, store_manager, accountant]
        dealerMobile: { type: string }
      required: [name, email, mobile, password]
    RegisterVerifyInput:
      type: object
      properties:
        email: { type: string }
        code: { type: string }
      required: [email, code]
    LoginEvent:
      type: object
      properties:
        id: { type: string }
        method: { type: string }
        rememberMe: { type: boolean }
        deviceInfo: { type: string }
        createdAt: { type: string }
      required: [id, method, rememberMe, createdAt]
    SessionInfo:
      type: object
      properties:
        id: { type: string }
        deviceInfo: { type: string }
        createdAt: { type: string }
        expiresAt: { type: string }
        current: { type: boolean }
      required: [id, createdAt, expiresAt, current]
    Message:
      type: object
      properties:
        message: { type: string }
      required: [message]
    AuthUser:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        email: { type: string }
        mobile: { type: string }
        role: { type: string }
        isActive: { type: boolean }
        designation: { type: string }
        joinDate: { type: string }
        businessName: { type: string }
        gstNumber: { type: string }
        shopAddress: { type: string }
        profilePhoto: { type: string }
        companyLogo: { type: string }
        shopId: { type: string }
        dealerId: { type: string }
      required: [id, name, email, mobile, role, isActive]
    StaffCreateInput:
      type: object
      properties:
        name: { type: string }
        email: { type: string }
        mobile: { type: string }
        password: { type: string }
        role: { type: string, enum: [reception, technician, store_manager, accountant, dealer_owner, dealer_staff] }
        designation: { type: string }
        dealerId: { type: string }
      required: [name, email, mobile, password, role]
    StaffUpdateInput:
      type: object
      properties:
        name: { type: string }
        mobile: { type: string }
        role: { type: string, enum: [reception, technician, store_manager, accountant, dealer_owner, dealer_staff] }
        designation: { type: string }
        password: { type: string }
    RegisterVerifyResult:
      type: object
      properties:
        token: { type: string }
        user:
          $ref: "#/components/schemas/AuthUser"
        pending: { type: boolean }
        message: { type: string }
    AuthSession:
      type: object
      properties:
        token: { type: string }
        user:
          $ref: "#/components/schemas/AuthUser"
      required: [token, user]
    Dealer:
      type: object
      properties:
        id: { type: string }
        dealerCode: { type: string }
        name: { type: string }
        shopName: { type: string }
        mobile: { type: string }
        location: { type: string }
        isActive: { type: boolean }
        createdById: { type: string }
        createdByName: { type: string }
        createdAt: { type: string }
      required: [id, dealerCode, name, mobile, isActive, createdAt]
    DealerWithCounts:
      allOf:
        - $ref: "#/components/schemas/Dealer"
        - type: object
          properties:
            totalRepairs: { type: number }
            received: { type: number }
            repairing: { type: number }
            ready: { type: number }
            delivered: { type: number }
          required: [totalRepairs, received, repairing, ready, delivered]
    DealerInput:
      type: object
      properties:
        name: { type: string }
        shopName: { type: string }
        mobile: { type: string }
        location: { type: string }
        isActive: { type: boolean }
    DealerStats:
      type: object
      properties:
        totalRepairs: { type: number }
        received: { type: number }
        repairing: { type: number }
        ready: { type: number }
        delivered: { type: number }
        cancelled: { type: number }
        afterSaleReturns: { type: number }
        refunded: { type: number }
        refundedAmount: { type: number }
        totalRepairValue: { type: number }
        pendingAmount: { type: number }
      required: [totalRepairs, received, repairing, ready, delivered, cancelled, afterSaleReturns, refunded, refundedAmount, totalRepairValue, pendingAmount]
    DealerProfile:
      type: object
      properties:
        dealer:
          $ref: "#/components/schemas/Dealer"
        stats:
          $ref: "#/components/schemas/DealerStats"
      required: [dealer, stats]
    DealerOverviewStats:
      type: object
      properties:
        totalDealerRepairs: { type: number }
        activeRepairs: { type: number }
        completedRepairs: { type: number }
        deliveredRepairs: { type: number }
        afterSaleReturns: { type: number }
        refunds: { type: number }
        totalRepairRevenue: { type: number }
        pendingPayments: { type: number }
      required: [totalDealerRepairs, activeRepairs, completedRepairs, deliveredRepairs, afterSaleReturns, refunds, totalRepairRevenue, pendingPayments]
    Customer:
      type: object
      properties:
        id: { type: string }
