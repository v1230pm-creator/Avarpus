      summary: Date-wise received vs repaired phone counts
      description: >
        Per-day counts of phones received (by receive date) and phones repaired
        (by repair-completed date) for the caller's shop. Counts only, no money.
      parameters:
        - { name: days, in: query, required: false, schema: { type: number }, description: "How many days back (default 30, max 365)" }
      responses:
        "200":
          description: Date-wise counts, newest first
          content:
            application/json:
              schema:
                type: object
                properties:
                  days:
                    type: array
                    items:
                      type: object
                      properties:
                        date: { type: string }
                        received: { type: number }
                        repaired: { type: number }
                      required: [date, received, repaired]
                required: [days]
  /activity:
    get:
      operationId: activityFeed
      tags: [dashboard]
      summary: Global activity feed (dealer/super_admin only)
      description: Merged, paginated audit feed of repair events and login events for the shop.
      parameters:
        - { name: page, in: query, required: false, schema: { type: number } }
        - { name: limit, in: query, required: false, schema: { type: number } }
        - { name: dateFrom, in: query, required: false, schema: { type: string } }
        - { name: dateTo, in: query, required: false, schema: { type: string } }
        - { name: type, in: query, required: false, schema: { type: string, enum: [repair, login] } }
      responses:
        "200":
          description: Activity feed
          content:
            application/json:
              schema:
                type: object
                properties:
                  activity:
                    type: array
                    items:
                      $ref: "#/components/schemas/Activity"
                  page: { type: number }
                  limit: { type: number }
                  hasMore: { type: boolean }
                required: [activity, page, limit, hasMore]
  /app-updates/latest:
    get:
      operationId: latestAppUpdate
      tags: [appUpdates]
      summary: Latest published OTA app update (or null)
      parameters:
        - name: buildNumber
          in: query
          required: false
          schema: { type: number }
          description: >
            Caller's installed build number. When present, the server records
            an update check and returns updateAvailable computed against it.
      responses:
        "200":
          description: Latest published update manifest, if any
          content:
            application/json:
              schema:
                type: object
                properties:
                  update:
                    oneOf:
                      - $ref: "#/components/schemas/AppUpdate"
                      - type: "null"
                  updateAvailable: { type: boolean }
                required: [update]
  /app-updates/stats:
    get:
      operationId: appUpdateStats
      tags: [appUpdates]
      summary: Aggregate OTA release stats for the admin dashboard (super_admin)
      responses:
        "200":
          description: Stats
          content:
            application/json:
              schema:
                type: object
                properties:
                  stats:
                    $ref: "#/components/schemas/AppUpdateStats"
                required: [stats]
  /app-updates/assets/{objectId}:
    get:
      operationId: appUpdateAsset
      tags: [appUpdates]
      summary: Serve a screenshot/image object uploaded for a release (binary)
      parameters:
        - { name: objectId, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Binary object stream
        "404":
          description: Object not found
  /app-updates/changelog:
    get:
      operationId: appUpdateChangelog
      tags: [appUpdates]
      summary: Published release changelog history
      responses:
        "200":
          description: Published releases, newest first
          content:
            application/json:
              schema:
                type: object
                properties:
                  updates:
                    type: array
                    items:
                      $ref: "#/components/schemas/AppUpdate"
                required: [updates]
  /app-updates:
    get:
      operationId: listAppUpdates
      tags: [appUpdates]
      summary: All releases incl. drafts (super_admin)
      responses:
        "200":
          description: All releases with admin fields
          content:
            application/json:
              schema:
                type: object
                properties:
                  updates:
                    type: array
                    items:
                      $ref: "#/components/schemas/AppUpdateAdmin"
                required: [updates]
    post:
      operationId: createAppUpdate
      tags: [appUpdates]
      summary: Create a draft release (super_admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AppUpdateInput"
      responses:
        "201":
          description: Created draft release
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppUpdateEnvelope"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /app-updates/upload-url:
    post:
      operationId: appUpdateUploadUrl
      tags: [appUpdates]
      summary: Presigned APK upload URL (super_admin)
      responses:
        "200":
          description: Presigned PUT URL and object path
          content:
            application/json:
              schema:
                type: object
                properties:
                  uploadURL: { type: string }
                  objectPath: { type: string }
                required: [uploadURL, objectPath]
  /app-updates/{id}:
    patch:
      operationId: updateAppUpdate
      tags: [appUpdates]
      summary: Edit a release (super_admin)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AppUpdateInput"
      responses:
        "200":
          description: Updated release
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppUpdateEnvelope"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /app-updates/{id}/apk:
    get:
      operationId: downloadAppUpdateApk
      tags: [appUpdates]
      summary: Download the APK of a published release (binary, supports Range)
      description: >
        Authenticated binary download. Supports HTTP Range requests for
        pause/resume (206 partial content, 416 for invalid ranges). Only
        published releases are downloadable. Clients should download this via
        a native file downloader with the bearer token header, not the
        generated JSON client.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Full APK stream (application/vnd.android.package-archive)
        "206":
          description: Partial APK stream for a Range request
        "404":
          description: Unknown, unpublished, or APK-less release
        "416":
          description: Invalid Range header
  /app-updates/{id}/publish:
    post:
      operationId: publishAppUpdate
      tags: [appUpdates]
      summary: Publish a release (super_admin) — auto-archives the previously published release
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AppUpdatePublishInput"
      responses:
        "200":
          description: Published release
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppUpdateEnvelope"
        "409":
          description: Build number is lower than the currently published release (send allowLowerBuild to override for rollback)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "400":
          description: Release incomplete (no APK)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /app-updates/{id}/unpublish:
    post:
      operationId: unpublishAppUpdate
      tags: [appUpdates]
